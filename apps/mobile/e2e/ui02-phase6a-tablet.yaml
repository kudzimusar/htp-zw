appId: zw.co.healthtimes.app.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Top Stories"
    timeout: 240000
- takeScreenshot: tablet-home

- openLink: "healthtimes://article/source-zimbabwe-strengthens-social-contracting-as-hiv-donor-funding-shrinks"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- scrollUntilVisible:
    element:
      text: "Zimbabwe Looks to Strengthen Social Contracting as HIV Donor Funding Shrinks"
    direction: DOWN
    timeout: 60000
- takeScreenshot: tablet-article

- openLink: "healthtimes://watch"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Watch"
    timeout: 30000
- extendedWaitUntil:
    visible: "Featured video"
    timeout: 30000
- takeScreenshot: tablet-watch

- openLink: "healthtimes://my"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "My HealthTimes"
    timeout: 20000
- takeScreenshot: tablet-my-healthtimes

- tapOn: "Countries & Interests"
- extendedWaitUntil:
    visible: "Edition & Preferences"
    timeout: 20000
- takeScreenshot: tablet-edition

# Tablet orientation evidence: same accepted hierarchy using extra width deliberately.
- setOrientation: LANDSCAPE_LEFT
- openLink: "healthtimes://"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Top Stories"
    timeout: 240000
- takeScreenshot: tablet-home-landscape
- setOrientation: PORTRAIT
