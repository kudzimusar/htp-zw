appId: zw.co.healthtimes.app.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "HealthTimes"
    timeout: 30000
- extendedWaitUntil:
    visible: "Top Stories"
    timeout: 30000
- takeScreenshot: tablet-home

- openLink: "healthtimes://article/source-zimbabwe-strengthens-social-contracting-as-hiv-donor-funding-shrinks"
- extendedWaitUntil:
    visible: "Zimbabwe Looks to Strengthen Social Contracting as HIV Donor Funding Shrinks"
    timeout: 30000
- takeScreenshot: tablet-article

- openLink: "healthtimes://watch"
- extendedWaitUntil:
    visible: "Watch"
    timeout: 30000
- extendedWaitUntil:
    visible: "Featured video"
    timeout: 30000
- takeScreenshot: tablet-watch

- openLink: "healthtimes://my"
- extendedWaitUntil:
    visible: "My HealthTimes"
    timeout: 20000
- takeScreenshot: tablet-my-healthtimes

- tapOn: "Countries & Interests"
- extendedWaitUntil:
    visible: "Edition & Preferences"
    timeout: 20000
- takeScreenshot: tablet-edition

# Tablet orientation evidence: same accepted hierarchy using extra width deliberately.
- setOrientation: LANDSCAPE
- openLink: "healthtimes://"
- extendedWaitUntil:
    visible: "Top Stories"
    timeout: 30000
- takeScreenshot: tablet-home-landscape
- setOrientation: PORTRAIT
