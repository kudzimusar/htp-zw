appId: zw.co.healthtimes.app.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Top Stories"
    timeout: 240000
- extendedWaitUntil:
    notVisible: "Loading Home…"
    timeout: 30000
- assertNotVisible: "FunctionCallException"
- assertNotVisible: "KeyChainException"
- assertNotVisible: ".*SecureStore.*(entitlement|Entitlement|error|Error|exception|Exception|failed|Failed).*"
- assertNotVisible: "Open in .*HealthTimes.*"
- takeScreenshot: home

# iOS first-use custom-scheme trust can dismiss the system sheet without
# settling the requested deep link. Prime the scheme on Home before the
# real Premium/Watch routes, and include openLink inside the retry block
# so re-invocation after prompt dismissal reaches the destination deterministically.
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink: "healthtimes://"
      - runFlow:
          when:
            visible: "Open in .*HealthTimes.*"
          commands:
            - tapOn: "Open"
      - extendedWaitUntil:
          visible: "Top Stories"
          timeout: 30000
      - assertNotVisible: "Open in .*HealthTimes.*"

- retry:
    maxRetries: 3
    commands:
      - openLink: "healthtimes://premium"
      - runFlow:
          when:
            platform: iOS
            visible: "Open in .*HealthTimes.*"
          commands:
            - tapOn: "Open"
      - extendedWaitUntil:
          visible: "HEALTHTIMES PREMIUM"
          timeout: 15000
- extendedWaitUntil:
    notVisible: "Checking membership options…"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading Premium journalism…"
    timeout: 30000
- assertNotVisible: "Premium journalism is temporarily unavailable"
- assertNotVisible: "FunctionCallException"
- assertNotVisible: "KeyChainException"
- assertNotVisible: ".*SecureStore.*(entitlement|Entitlement|error|Error|exception|Exception|failed|Failed).*"
- assertNotVisible: "Open in .*HealthTimes.*"
- takeScreenshot: premium

- retry:
    maxRetries: 3
    commands:
      - openLink: "healthtimes://watch"
      - runFlow:
          when:
            platform: iOS
            visible: "Open in .*HealthTimes.*"
          commands:
            - tapOn: "Open"
      - extendedWaitUntil:
          visible: "Featured video"
          timeout: 15000
- extendedWaitUntil:
    visible: "Watch"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading videos…"
    timeout: 30000
- assertNotVisible: "Videos are temporarily unavailable"
- assertNotVisible: "FunctionCallException"
- assertNotVisible: "KeyChainException"
- assertNotVisible: ".*SecureStore.*(entitlement|Entitlement|error|Error|exception|Exception|failed|Failed).*"
- assertNotVisible: "Open in .*HealthTimes.*"
- takeScreenshot: watch
