appId: zw.co.healthtimes.app.dev
---
- openLink: "healthtimes://search"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Try searching for"
    timeout: 90000
- extendedWaitUntil:
    visible: "Intelligent Search"
    timeout: 45000
- extendedWaitUntil:
    visible: "Search HealthTimes"
    timeout: 45000
- assertVisible: "All"
- assertVisible: "Articles"
- assertVisible: "Videos"
- assertVisible: "Audio"
- assertVisible: "Authors"
- assertVisible: "Show search filters"
- assertVisible: "Home(?:, tab, [0-9]+ of [0-9]+)?"
- assertVisible: "Explore(?:, tab, [0-9]+ of [0-9]+)?"
- assertVisible: "Live(?:, tab, [0-9]+ of [0-9]+)?"
- assertVisible: "Watch(?:, tab, [0-9]+ of [0-9]+)?"
- assertVisible: "My HT(?:, tab, [0-9]+ of [0-9]+)?"
- assertNotVisible: "^Search, tab, [0-9]+ of [0-9]+$"
- assertNotVisible: "RedBox"
- assertNotVisible: "Unhandled JS Exception"
- takeScreenshot: search-initial
- tapOn: "Show search filters"
- extendedWaitUntil:
    visible: "COUNTRY"
    timeout: 20000
- assertVisible: "COUNTRY"
- extendedWaitUntil:
    visible: "TOPIC / DESK"
    timeout: 20000
- assertVisible: "TOPIC / DESK"
- assertNotVisible: "RedBox"
- assertNotVisible: "Unhandled JS Exception"
- takeScreenshot: search-filters-open
