appId: zw.co.healthtimes.app.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Top Stories"
    timeout: 240000
- takeScreenshot: home-light

# Search keyboard/focus
- openLink: "healthtimes://search"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Intelligent Search"
    timeout: 20000
- tapOn: "Search HealthTimes"
- inputText: "health"
- takeScreenshot: search-keyboard
- hideKeyboard
- tapOn: "Search"
- extendedWaitUntil:
    visible: "Article results"
    timeout: 20000
- takeScreenshot: search-results

# Public Article + native Save/Offline/Share
- openLink: "healthtimes://article/source-zimbabwe-strengthens-social-contracting-as-hiv-donor-funding-shrinks"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Zimbabwe Looks to Strengthen Social Contracting as HIV Donor Funding Shrinks"
    timeout: 30000
- tapOn: "Save article"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 10000
- tapOn: "Download article for offline reading"
- extendedWaitUntil:
    visible: "Available offline"
    timeout: 10000
- takeScreenshot: article-actions-light
- tapOn: "Share article"
- takeScreenshot: article-native-share
- stopApp

# Saved + Offline persistence after leaving the Article route
- launchApp
- extendedWaitUntil:
    visible: "Top Stories"
    timeout: 120000
- openLink: "healthtimes://saved?tab=saved"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Saved & Offline"
    timeout: 30000
- extendedWaitUntil:
    visible: "Saved stories"
    timeout: 30000
- assertVisible: "Zimbabwe Looks to Strengthen Social Contracting as HIV Donor Funding Shrinks"
- takeScreenshot: saved-persistence

- openLink: "healthtimes://saved?tab=offline"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Available offline"
    timeout: 30000
- assertVisible: "Zimbabwe Looks to Strengthen Social Contracting as HIV Donor Funding Shrinks"
- takeScreenshot: offline-persistence

# Premium anonymous body protection / paywall
- openLink: "healthtimes://article/source-us-embassy-challenges-zimbabwe-rejected-health-mou"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- scrollUntilVisible:
    element:
      text: "Continue reading with HealthTimes Premium"
    direction: DOWN
    timeout: 30000
- assertVisible: "Continue reading with HealthTimes Premium"
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            text: "Go to HealthTimes Premium"
          direction: DOWN
          visibilityPercentage: 20
          timeout: 30000
      - assertVisible: "Go to HealthTimes Premium"
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            text: "Go Premium"
          direction: DOWN
          visibilityPercentage: 50
          timeout: 20000
      - assertVisible: "Go Premium"
- takeScreenshot: premium-locked-light

# Representative accepted Reader surfaces
- openLink: "healthtimes://explore"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Explore"
    timeout: 20000
- takeScreenshot: explore-light

- openLink: "healthtimes://live"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Live"
    timeout: 20000
- takeScreenshot: live-light

- openLink: "healthtimes://watch"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Watch"
    timeout: 30000
- extendedWaitUntil:
    visible: "Featured video"
    timeout: 30000
- assertVisible: ".*YouTube.*"
- takeScreenshot: watch-light

# Source-backed external YouTube destination
- tapOn:
    text: ".*YouTube.*"
    index: 0
- takeScreenshot: watch-external-youtube
- stopApp

- launchApp
- extendedWaitUntil:
    visible: "Top Stories"
    timeout: 120000
- openLink: "healthtimes://listen"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Listen"
    timeout: 20000
- assertVisible: "No audio yet"
- takeScreenshot: listen-truthful

# My HealthTimes and intentional navigation into Edition
- openLink: "healthtimes://my"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "My HealthTimes"
    timeout: 20000
- takeScreenshot: my-healthtimes-light
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "Countries & Interests.*"
      - tapOn: "Countries & Interests.*"
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            text: "Countries & Interests"
          direction: DOWN
          timeout: 20000
      - tapOn: "Countries & Interests"
- extendedWaitUntil:
    visible: "Select Your Edition"
    timeout: 20000

# Historical Phase-6A label "Edition & Preferences" is superseded by canonical "Select Your Edition".
# Edition interaction and device persistence
- tapOn: "Search country or region"
- inputText: "Africa"
- hideKeyboard
- extendedWaitUntil:
    visible: "Africa"
    timeout: 10000
- tapOn:
    text: "Africa"
    index: 0
- scrollUntilVisible:
    element:
      text: "Save Preferences"
    direction: DOWN
    timeout: 20000
- tapOn: "Save Preferences"
- scrollUntilVisible:
    element:
      text: "Preferences saved on this device."
    direction: DOWN
    visibilityPercentage: 50
    timeout: 20000
- assertVisible: "Preferences saved on this device."
- takeScreenshot: edition-light

# My HealthTimes navigation to the actual Appearance preference
- openLink: "healthtimes://my"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "My HealthTimes"
    timeout: 20000
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            text: "Appearance / Theme.*"
          direction: DOWN
          timeout: 20000
      - tapOn: "Appearance / Theme.*"
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            text: "Appearance / Theme"
          direction: DOWN
          timeout: 20000
      - tapOn: "Appearance / Theme"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 20000
- tapOn: "Dark"
- assertVisible: "Dark"
- takeScreenshot: appearance-dark-selected

# Required native dark-mode matrix
- openLink: "healthtimes://"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Top Stories"
    timeout: 120000
- takeScreenshot: home-dark

- openLink: "healthtimes://article/source-zimbabwe-strengthens-social-contracting-as-hiv-donor-funding-shrinks"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Zimbabwe Looks to Strengthen Social Contracting as HIV Donor Funding Shrinks"
    timeout: 30000
- takeScreenshot: article-dark

- openLink: "healthtimes://article/source-us-embassy-challenges-zimbabwe-rejected-health-mou"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- scrollUntilVisible:
    element:
      text: "Continue reading with HealthTimes Premium"
    direction: DOWN
    timeout: 30000
- assertVisible: "Continue reading with HealthTimes Premium"
- takeScreenshot: premium-dark

- openLink: "healthtimes://premium"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "HEALTHTIMES PREMIUM"
    timeout: 30000
- takeScreenshot: premium-landing-dark

- openLink: "healthtimes://watch"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Featured video"
    timeout: 30000
- takeScreenshot: watch-dark

- openLink: "healthtimes://my"
- runFlow:
    when:
      platform: iOS
      visible: "Open in .*HealthTimes Dev.*"
    commands:
      - tapOn: "Open"
- scrollUntilVisible:
    element:
      text: "My HealthTimes"
    direction: UP
    visibilityPercentage: 50
    timeout: 20000
- assertVisible: "My HealthTimes"
- takeScreenshot: my-healthtimes-dark
