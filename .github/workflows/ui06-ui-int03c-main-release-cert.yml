name: UI-INT-03C Final Main Release Live Certification

on:
  push:
    branches:
      - test/ui06-ui-int03c-main-release-cert
    paths:
      - '.github/workflows/ui06-ui-int03c-main-release-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui06-ui-int03c-main-release-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-live-main-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_URL: https://kudzimusar.github.io/htp-zw
      TARGET_DEPLOYED_SHA: dcfdedcf5dc7f4c0e47dc968e21b63d3d2d6cb95
      ACCEPTED_EXECUTABLE_SHA: dcfdedcf5dc7f4c0e47dc968e21b63d3d2d6cb95
      CERTIFICATION_TOOLING_SHA: 2b425e0c4bf44fb6aa2a1f56e1f8e0cc39bfc280
      ARTIFACT_DIR: artifacts/ui06/ui-int03c-main-release-cert

    steps:
      - name: Check out accepted certification tooling
        uses: actions/checkout@v4
        with:
          ref: 2b425e0c4bf44fb6aa2a1f56e1f8e0cc39bfc280
          fetch-depth: 1

      - name: Prove accepted certification tooling SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CERTIFICATION_TOOLING_SHA=$actual"
          echo "TARGET_DEPLOYED_SHA=$TARGET_DEPLOYED_SHA"
          echo "ACCEPTED_EXECUTABLE_SHA=$ACCEPTED_EXECUTABLE_SHA"
          test "$actual" = "$CERTIFICATION_TOOLING_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install certification dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: |
          npx playwright --version
          npx playwright install --with-deps chromium

      - name: Run accepted live Premium journey certification against canonical main
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_NAME: ${{ runner.name }}
        run: node scripts/ui/ui06-ui-int02-premium-live-cert.mjs

      - name: Upload UI-INT-03C live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui06-ui-int03c-main-release-cert
          path: artifacts/ui06/ui-int03c-main-release-cert/
          if-no-files-found: warn
          retention-days: 30
