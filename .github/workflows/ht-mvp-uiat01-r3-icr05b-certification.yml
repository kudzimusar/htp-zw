name: HT-MVP-UIAT-01-R3-ICR05B — Session and Evidence Certification

on:
  push:
    branches:
      - fix/ht-mvp-uiat01-r3-icr05b-final-ci-session-evidence
      - fix/ht-g2-rbac-session-boundary
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact commit SHA authorized for protected Staging UAT fault-injection execution'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deterministic-security-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Parse-check the gated physical fault suite and attested UAT executor without running live sessions
        run: |
          node --check tests/harness/icr05a-fault-injection.test.mjs
          node --check scripts/release/run-protected-staging-uat.mjs
      - name: Run 10 ICR05A consistency, 12 ICR05B session negative-path, 10 workflow containment & negative trust-boundary checks, and source-consistency route verification
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/harness/icr05a-consistency.test.mjs tests/harness/icr05b-session-negative.test.mjs 2>&1 | tee /tmp/icr05b-deterministic.tap
          grep -Eq '^# tests 22$' /tmp/icr05b-deterministic.tap
          grep -Eq '^# pass 22$' /tmp/icr05b-deterministic.tap
          grep -Eq '^# fail 0$' /tmp/icr05b-deterministic.tap
          grep -Eq '^# skipped 0$' /tmp/icr05b-deterministic.tap
          node --test tests/harness/icr05b-workflow-containment.test.mjs 2>&1 | tee /tmp/icr05b-workflow-containment.tap
          grep -Eq '^# tests 10$' /tmp/icr05b-workflow-containment.tap
          grep -Eq '^# pass 10$' /tmp/icr05b-workflow-containment.tap
          grep -Eq '^# fail 0$' /tmp/icr05b-workflow-containment.tap
          node scripts/release/run-protected-staging-uat.mjs \
            --mode verify-route \
            --expected-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output /tmp/ht-g2-uat-route-attestation.json
      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icr05b-deterministic-exact-head
          path: |
            /tmp/icr05b-deterministic.tap
            /tmp/icr05b-workflow-containment.tap
            /tmp/ht-g2-uat-route-attestation.json
          if-no-files-found: warn

  disposable-postgres-rbac-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
      - name: Run G2 RBAC Session Boundary (10 suites across all 9 functions) & Story Title Authority (15 + 9 suites) Disposable PostgreSQL 16 Suites
        shell: bash
        env:
          HT_DISPOSABLE_PG_BASE_URI: postgres://postgres:ephemeral-ci-only@127.0.0.1:55432
        run: |
          set -euo pipefail
          node --test tests/database/g2-rbac-session-boundary.test.mjs 2>&1 | tee /tmp/g2-rbac-session-boundary.tap
          grep -Eq '^# tests 10$' /tmp/g2-rbac-session-boundary.tap
          grep -Eq '^# pass 10$' /tmp/g2-rbac-session-boundary.tap
          grep -Eq '^# fail 0$' /tmp/g2-rbac-session-boundary.tap
          node --test tests/database/real-schema-title-authority.test.mjs 2>&1 | tee /tmp/real-schema-title-authority.tap
          grep -Eq '^# tests 15$' /tmp/real-schema-title-authority.tap
          grep -Eq '^# pass 15$' /tmp/real-schema-title-authority.tap
          grep -Eq '^# fail 0$' /tmp/real-schema-title-authority.tap
          node --test tests/database/story-title-authority.test.mjs 2>&1 | tee /tmp/story-title-authority.tap
          grep -Eq '^# tests 9$' /tmp/story-title-authority.tap
          grep -Eq '^# pass 9$' /tmp/story-title-authority.tap
          grep -Eq '^# fail 0$' /tmp/story-title-authority.tap
      - name: Upload disposable PostgreSQL regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-rbac-disposable-postgres-evidence
          path: |
            /tmp/g2-rbac-session-boundary.tap
            /tmp/real-schema-title-authority.tap
            /tmp/story-title-authority.tap
          if-no-files-found: warn

  physical-live-fault-injection:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/release/ht-mvp-2.0-final' || github.ref == 'refs/heads/fix/ht-g2-rbac-session-boundary')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging-uat-certification
    # NOTE ON NON-MERGE EXECUTION ROUTE & EXTERNAL WARRANT REQUIREMENT:
    # 1. GitHub Actions only registers `workflow_dispatch` for workflows present on the default branch (`main`).
    #    While `main` remains pre-G1 (`6994aa18d37e2189dbc1d3f8efc76a638ee0971c`, Merge authorization: NONE),
    #    the canonical non-merge execution route is an Owner-operated isolated runner invoking:
    #      `node scripts/release/run-protected-staging-uat.mjs --mode live --expected-sha <SHA> --policy-warrant <EXTERNAL_WARRANT_PATH>`
    # 2. Both the Owner-operated runner and this workflow job require an external Ed25519 Owner-signed warrant
    #    outside the repository working tree (`--policy-warrant /tmp/ht-g2-owner-warrant.json`) before any staging
    #    credentials can be used.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source consistency and exact authorized SHA before accessing protected UAT credentials
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test -n "$EXPECTED_SHA" && test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "::error title=SHA_MISMATCH::Checked out SHA ($ACTUAL_SHA) does not match authorized expected_sha ($EXPECTED_SHA)."
            exit 1
          }
          node scripts/release/run-protected-staging-uat.mjs \
            --mode verify-route \
            --expected-sha "$EXPECTED_SHA" \
            --output /tmp/ht-g2-uat-route-attestation.json
      - name: Execute warrant-verified live Staging UAT via allowlist-bound runner
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OWNER_WARRANT_JSON: ${{ secrets.HEALTHTIMES_OWNER_WARRANT_JSON }}
          UAT_ACTORS_JSON: ${{ secrets.HEALTHTIMES_UAT_ACTORS_JSON }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.HEALTHTIMES_STAGING_MANAGEMENT_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::add-mask::${SUPABASE_ACCESS_TOKEN}"
          fi
          WARRANT_FILE="$(mktemp /tmp/ht-g2-owner-warrant-XXXXXX.json)"
          trap 'rm -f "$WARRANT_FILE"' EXIT
          chmod 600 "$WARRANT_FILE"
          printf '%s' "${OWNER_WARRANT_JSON:-}" > "$WARRANT_FILE"
          node scripts/release/run-protected-staging-uat.mjs \
            --mode live \
            --expected-sha "$EXPECTED_SHA" \
            --policy-warrant "$WARRANT_FILE" \
            --output /tmp/ht-g2-uat-route-attestation.json \
            --tap-output /tmp/icr05a-physical.tap
      - name: Upload physical test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icr05a-staging-physical-summary
          path: |
            /tmp/ht-g2-uat-route-attestation.json
            /tmp/icr05a-physical.tap
          if-no-files-found: warn
