name: NM-07 Phase 6 Migrated Corpus Reader

on:
  push:
    branches:
      - integration/nm07-phase6-migrated-corpus-reader
      - integration/ag07-phase8-convergence-candidate
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'api/web.js'
      - 'api/public.js'
      - 'tests/**'
      - 'scripts/web/**'
      - 'scripts/migration/**'
      - '.github/workflows/nm07-phase6-migrated-corpus.yml'
      - 'docs/migration/24_NM07_MIGRATED_CORPUS_READER_INTEGRATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nm07-phase6-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  APP_ENV: staging
  EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
  EXPO_PUBLIC_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
  HEALTHTIMES_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  HEALTHTIMES_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
  HEALTHTIMES_WEB_BASE_URL: ""

jobs:
  reader-convergence:
    name: Migrated corpus Reader convergence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          [[ "$actual" == "$EXPECTED_SHA" ]] || { echo "Exact-head checkout mismatch"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Install universal Reader dependencies
        run: npm install --prefix apps/mobile --no-audit --no-fund
      - name: Typecheck universal Reader
        run: npm run native:check
      - name: Run Phase 6 migrated-corpus integration suite
        run: npm --prefix apps/mobile run test:migrated-corpus
      - name: Preserve Native Reader contracts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/mobile run test:foundation
          npm --prefix apps/mobile run test:content-contracts
          npm --prefix apps/mobile run test:reader-product
          npm --prefix apps/mobile run test:reader-fidelity
          npm --prefix apps/mobile run test:native-certification
      - name: Preserve CP5 and adjacent security contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:ag05:capability
          npm run test:ag06:contract
          npm run test:ca01:contract
          npm run test:com01:contract
          npm run test:phase4:web
      - name: Build staging Web/PWA Reader
        run: npm run build:phase4:web
      - name: Prove raw HTTP route and SEO decisions
        run: npm run verify:phase4:http
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          node scripts/web/phase4-smoke-server.js >/tmp/phase6-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            if [[ "$attempt" == "5" ]]; then cat /tmp/phase6-smoke.log; exit 1; fi
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4174 npm run test:phase4:browser
      - name: Upload Phase 6 Reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nm07-phase6-reader-evidence
          path: |
            playwright-report
            test-results
            apps/mobile/dist/build-info.json
            migration-output/ag07-phase4/http-evidence.json
          if-no-files-found: warn
          retention-days: 14

  readonly-staging:
    name: Read-only staging corpus and CP5 invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          [[ "$actual" == "$EXPECTED_SHA" ]] || { echo "Exact-head checkout mismatch"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Install universal Reader dependencies
        run: npm install --prefix apps/mobile --no-audit --no-fund
      - name: Refuse privileged or non-staging targets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEALTHTIMES_SUPABASE_URL" == *"gcdohgbmqhqwydgaxrcr"* ]]
          test -n "$HEALTHTIMES_SUPABASE_PUBLISHABLE_KEY"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${HEALTHTIMES_SUPABASE_SERVICE_ROLE_KEY:-}"
      - name: Re-prove CP5 read-only staging semantics
        run: npm run verify:ag05:readonly
      - name: Re-run live Phase 6 corpus matrix
        run: npm --prefix apps/mobile run test:migrated-corpus
      - name: Upload read-only staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nm07-phase6-readonly-staging-evidence
          path: migration-output/ag05-phase3/staging-evidence.json
          if-no-files-found: error
          retention-days: 14
