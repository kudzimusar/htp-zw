name: Validate HealthTimes 2.0

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check newsroom.js

      - name: Validate product contract and local references
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          required = [
              'index.html','article.html','premium.html','preferences.html','about.html',
              'newsroom.html','manual.html','404.html','styles.css','newsroom.css',
              'app.js','newsroom.js','favicon.svg','site.webmanifest','README.md',
              'docs/HEALTHTIMES_2_IMPLEMENTATION_PLAN.md',
              'docs/HEALTHTIMES_OPERATIONS_MANUAL.md',
              '.github/workflows/pages.yml',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')

          class Parser(HTMLParser):
              pass

          public_pages = ['index.html','article.html','premium.html','preferences.html','about.html','manual.html','404.html']
          for filename in public_pages:
              text = Path(filename).read_text(encoding='utf-8')
              Parser().feed(text)
              if 'styles.css' not in text or 'app.js' not in text:
                  raise SystemExit(f'{filename} does not load the shared public design/runtime')
              if re.search(r'href=["\']#["\']', text):
                  raise SystemExit(f'{filename} contains a placeholder href="#"')

          newsroom = Path('newsroom.html').read_text(encoding='utf-8')
          Parser().feed(newsroom)
          for ref in ('styles.css','newsroom.css','newsroom.js'):
              if ref not in newsroom:
                  raise SystemExit(f'newsroom.html is missing {ref}')

          js = Path('app.js').read_text(encoding='utf-8')
          public_assertions = {
              '30-second preview': r'PREVIEW_MS\s*=\s*30_000',
              'preview persistence': r'htpPremiumPreviewStartedAt',
              'subscription state': r'htpDemoSubscribed',
              'mobile app navigation': r'mobile-bottom-nav',
              'WhatsApp desk': r'263776280754',
              'Ask HealthTimes': r'Ask HealthTimes',
              'medical safety boundary': r'diagnos',
              'saved reading': r'htpSavedArticles',
              'reader preferences': r'htpReaderPreferences',
          }
          failed = [name for name, pattern in public_assertions.items() if not re.search(pattern, js)]
          if failed:
              raise SystemExit(f'Missing public product behavior: {failed}')

          njs = Path('newsroom.js').read_text(encoding='utf-8')
          newsroom_assertions = {
              'publisher role': r'Publisher / Owner',
              'editor role': r'Editor-in-Chief',
              'reporter role': r'Reporter / Journalist',
              'commercial separation': r'Commercial Manager',
              'role permissions': r'permissions\s*=',
              'workflow audit': r'htpNewsroomAudit',
              'story workflow': r'Fact check',
              'newsletter': r'Newsletter',
              'WhatsApp': r'WhatsApp',
          }
          failed = [name for name, pattern in newsroom_assertions.items() if not re.search(pattern, njs)]
          if failed:
              raise SystemExit(f'Missing newsroom behavior: {failed}')

          local_refs = set()
          for filename in public_pages + ['newsroom.html']:
              text = Path(filename).read_text(encoding='utf-8')
              for ref in re.findall(r'(?:href|src)=["\']([^"\']+)["\']', text):
                  if ref.startswith(('http://','https://','mailto:','tel:','#')):
                      continue
                  ref = ref.split('?')[0].split('#')[0]
                  if ref and not ref.endswith('.html'):
                      local_refs.add(ref)
          missing_refs = [ref for ref in sorted(local_refs) if not Path(ref).exists()]
          if missing_refs:
              raise SystemExit(f'Missing local assets referenced by pages: {missing_refs}')

          print('HealthTimes 2.0 validation passed.')
