name: Validate frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate required frontend files and references
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import sys

          required = [
              Path('index.html'),
              Path('premium.html'),
              Path('article.html'),
              Path('styles.css'),
              Path('app.js'),
              Path('README.md'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')

          class Parser(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)

          for filename in ('index.html', 'premium.html', 'article.html'):
              text = Path(filename).read_text(encoding='utf-8')
              Parser().feed(text)
              for required_ref in ('styles.css', 'app.js'):
                  if required_ref not in text:
                      raise SystemExit(f'{filename} does not reference {required_ref}')
              if 'mobile-bottom-nav' not in text:
                  raise SystemExit(f'{filename} is missing mobile bottom navigation')

          js = Path('app.js').read_text(encoding='utf-8')
          assertions = {
              '30-second preview': r'PREVIEW_MS\s*=\s*30_000',
              'premium start persistence': r'htpPremiumPreviewStartedAt',
              'demo subscriber state': r'htpDemoSubscribed',
              'US$5 proposition': r'US\$5',
              'AI medical safety boundary': r'diagnos',
          }
          failed = [name for name, pattern in assertions.items() if not re.search(pattern, js)]
          if failed:
              raise SystemExit(f'Missing expected demo behavior: {failed}')

          print('Static frontend validation passed.')
