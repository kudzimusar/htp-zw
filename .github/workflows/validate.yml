name: Validate HealthTimes 2.0

on:
  push:
    branches:
      - main
      - integration/ag07-phase8-convergence-candidate
      - integration/ag07-phase12-legacy-retirement-precp7
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$CHECKED_OUT_SHA"
          test "$CHECKED_OUT_SHA" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root and canonical Reader dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix apps/mobile --no-audit --no-fund

      - name: Validate protected operational JavaScript syntax
        run: |
          node --check newsroom.js
          node --check api/newsroom.js
          node --check api/discussion.js
          node --check api/communications.js
          node --check scripts/web/phase4-smoke-server.js

      - name: Validate canonical apps/mobile Reader contracts
        run: |
          npm run native:check
          npm --prefix apps/mobile run test:content-contracts
          npm --prefix apps/mobile run test:reader-product
          npm --prefix apps/mobile run test:migrated-corpus
          npm --prefix apps/mobile run test:premium-hospaz
          npm run test:phase4:web

      - name: Prove dual-serving retirement fails closed
        run: npm run test:phase12:dual-serving

      - name: Preserve Newsroom and communications security contracts
        run: |
          npm run test:ag06:contract
          npm run test:ca01:contract
          npm run test:com01:contract

      - name: Validate authority boundary and retained provenance
        shell: python
        run: |
          from pathlib import Path
          import json

          canonical = [
              'apps/mobile/package.json',
              'apps/mobile/app/_layout.tsx',
              'apps/mobile/app/(reader)/index.tsx',
              'apps/mobile/app/(reader)/explore.tsx',
              'apps/mobile/app/(reader)/live.tsx',
              'apps/mobile/app/(reader)/watch.tsx',
              'apps/mobile/app/(reader)/my.tsx',
              'apps/mobile/app/search.tsx',
              'apps/mobile/app/premium.tsx',
              'apps/mobile/app/article/[id].tsx',
              'apps/mobile/public/manifest.json',
              'apps/mobile/public/sw.js',
              'vercel.json',
          ]
          newsroom = [
              'newsroom.html',
              'newsroom.js',
              'newsroom.css',
              'api/newsroom.js',
              'api/discussion.js',
              'api/communications.js',
          ]
          legacy_evidence = [
              'index.html',
              'article.html',
              'premium.html',
              'preferences.html',
              'about.html',
              'archive.html',
              'app.js',
              'reader.js',
              'v21.js',
              'styles.css',
              'v21.css',
          ]
          missing = [p for p in canonical + newsroom + legacy_evidence if not Path(p).is_file()]
          if missing:
              raise SystemExit(f'Missing required canonical/protected/evidence files: {missing}')

          vercel = json.loads(Path('vercel.json').read_text(encoding='utf-8'))
          if vercel.get('outputDirectory') != 'apps/mobile/dist':
              raise SystemExit('Vercel public presentation is not apps/mobile/dist')

          pages = Path('.github/workflows/pages.yml').read_text(encoding='utf-8')
          if 'path: .' in pages:
              raise SystemExit('GitHub Pages can still upload repository root')
          if 'path: apps/mobile/dist' not in pages:
              raise SystemExit('GitHub Pages does not upload canonical apps/mobile output')

          legacy_marker = 'LEGACY / SUPERSEDED / NON-SERVING EVIDENCE'
          for suite in ['tests/uat.spec.js','tests/reader.spec.js','tests/mobile-quality.spec.js']:
              if legacy_marker not in Path(suite).read_text(encoding='utf-8'):
                  raise SystemExit(f'{suite} is not explicitly classified as legacy evidence')

          newsroom_js = Path('newsroom.js').read_text(encoding='utf-8')
          forbidden = ['localStorage', 'HealthTimes#Publisher26', 'HealthTimes#Editor26', 'HealthTimes#Reporter26', 'HealthTimes#Commercial26']
          leaked = [item for item in forbidden if item in newsroom_js]
          if leaked:
              raise SystemExit(f'Browser-local Newsroom authority/credentials remain: {leaked}')

          api = Path('api/newsroom.js').read_text(encoding='utf-8')
          for required in ('HttpOnly','x-htp-csrf','newsroom_register_session','SUPABASE_SERVICE_ROLE_KEY'):
              if required not in api:
                  raise SystemExit(f'Missing AG-06 API security contract: {required}')

          print('Canonical Reader authority, retained legacy provenance and protected Newsroom boundary: PASS')
