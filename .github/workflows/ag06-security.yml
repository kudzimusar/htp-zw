name: AG-06 Newsroom Security

on:
  push:
    branches:
      - integration/ag07-phase8-convergence-candidate
      - integration/ag07-nm07-phase10-visual-conformance
      - integration/ag07-phase12-legacy-retirement-precp7
  pull_request:
    paths:
      - 'api/newsroom.js'
      - 'newsroom.js'
      - 'newsroom.html'
      - 'newsroom.css'
      - 'vercel.json'
      - 'supabase/migrations/**'
      - 'tests/ag06-*.spec.js'
      - 'tests/newsroom-os.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - 'scripts/ag06/**'
      - 'apps/mobile/src/services/**'
      - 'apps/mobile/tests/**'
      - '.github/workflows/ag06-security.yml'
  workflow_dispatch:

concurrency:
  group: healthtimes-staging-security-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          [[ "$actual" == "$EXPECTED_SHA" ]] || { echo "Exact-head checkout mismatch"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: AG-06 static authorization contract
        run: npm run test:ag06:contract
      - name: Secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -nE 'eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{20,}' -- ':!package-lock.json'
          ! git grep -nE 'postgres(ql)?://[^[:space:]@]+:[^[:space:]@]+@' -- ':!docs/**'
          ! git grep -nE 'HealthTimes#(Publisher|Editor|Reporter|Commercial|Audience)[0-9]+' -- newsroom.js newsroom.html api || true
          if git grep -nE 'HealthTimes#(Publisher|Editor|Reporter|Commercial|Audience)[0-9]+' -- newsroom.js newsroom.html api; then
            echo 'Legacy demo credential literal detected in runtime code.'
            exit 1
          fi

  disposable-supabase-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          [[ "$actual" == "$EXPECTED_SHA" ]] || { echo "Exact-head checkout mismatch"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then
            npx --yes supabase@2.117.0 init
          fi
      - name: Start disposable Supabase
        run: npx --yes supabase@2.117.0 start
      - name: Apply all migrations from zero
        run: npx --yes supabase@2.117.0 db reset --local
      - name: Stop disposable Supabase
        if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup || true

  local-newsroom-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          [[ "$actual" == "$EXPECTED_SHA" ]] || { echo "Exact-head checkout mismatch"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Unauthenticated gateway and local regression
        run: npx playwright test tests/newsroom-os.spec.js

  # Staging-only certification uses GitHub OIDC and ephemeral Auth users; no repository secrets.
  live-staging-security:
    outputs:
      story_id: ${{ steps.nm04-stage.outputs.story_id }}
      slug: ${{ steps.nm04-stage.outputs.slug }}
      title: ${{ steps.nm04-stage.outputs.title }}
      author_name: ${{ steps.nm04-stage.outputs.author_name }}
      published_at: ${{ steps.nm04-stage.outputs.published_at }}
      featured_public_url: ${{ steps.nm04-stage.outputs.featured_public_url }}
      featured_checksum: ${{ steps.nm04-stage.outputs.featured_checksum }}
      body_text: ${{ steps.nm04-stage.outputs.body_text }}
      alt_text: ${{ steps.nm04-stage.outputs.alt_text }}
      caption: ${{ steps.nm04-stage.outputs.caption }}
      credit: ${{ steps.nm04-stage.outputs.credit }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AG06_STAGING_BASE_URL: https://localhost:4173
      AG06_STAGING_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
      AG06_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
      PLAYWRIGHT_BASE_URL: https://localhost:4173
      SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
      AG06_CERTIFICATION_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          [[ "$actual" == "$EXPECTED_SHA" ]] || { echo "Exact-head checkout mismatch"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require bounded HealthTimes Staging configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AG06_STAGING_SUPABASE_URL" == *"gcdohgbmqhqwydgaxrcr"* ]] || { echo "Refusing non-HealthTimes-Staging Supabase project."; exit 1; }
          [[ "$SUPABASE_URL" == "$AG06_STAGING_SUPABASE_URL" ]] || { echo "Newsroom gateway and live RLS target differ."; exit 1; }
      - name: Provision four ephemeral staging role identities
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          roles=(reporter editor commercial publisher)
          accounts_file=/tmp/ag06-accounts.json
          printf '[' > "$accounts_file"
          first=1
          for role in "${roles[@]}"; do
            upper="$(printf '%s' "$role" | tr '[:lower:]' '[:upper:]')"
            email="ag06-${role}-${tag}@healthtimes.co.zw"
            password="Ht!$(openssl rand -hex 18)Aa7"
            echo "::add-mask::$password"
            echo "AG06_${upper}_EMAIL=$email" >> "$GITHUB_ENV"
            echo "AG06_${upper}_PASSWORD=$password" >> "$GITHUB_ENV"
            item="$(node -e 'const [role,email,password]=process.argv.slice(1);process.stdout.write(JSON.stringify({role,email,password}))' "$role" "$email" "$password")"
            if [[ "$first" == "0" ]]; then printf ',' >> "$accounts_file"; fi
            printf '%s' "$item" >> "$accounts_file"
            first=0
          done
          printf ']' >> "$accounts_file"

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=healthtimes-ag06-certification"
          oidc_token="$(curl --silent --show-error --fail             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$oidc_url" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          echo "::add-mask::$oidc_token"

          # Synthetic CI identities are created with email_confirm=true by the OIDC provisioner. Never send invite/recovery mail to them.
          payload="$(node -e 'const fs=require("fs");const [run,attempt]=process.argv.slice(1);const accounts=JSON.parse(fs.readFileSync("/tmp/ag06-accounts.json","utf8"));process.stdout.write(JSON.stringify({action:"provision",run_id:run,run_attempt:attempt,accounts}))' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          code="$(curl --silent --show-error -o /tmp/ag06-provision.json -w '%{http_code}'             -X POST "$AG06_STAGING_SUPABASE_URL/functions/v1/ag06-certification-provision"             -H "Authorization: Bearer $oidc_token"             -H "Content-Type: application/json"             --data "$payload")"
          cat /tmp/ag06-provision.json
          [[ "$code" == "200" ]] || { echo "AG-06 staging identity provisioning failed with HTTP $code."; exit 1; }
          node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync("/tmp/ag06-provision.json","utf8"));if(!v.ok||v.project_ref!=="gcdohgbmqhqwydgaxrcr"||!Array.isArray(v.users)||v.users.length!==4)process.exit(1);'
          echo "AG06_STAGING_IDENTITIES_READY"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start exact-branch Newsroom gateway
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes             -keyout /tmp/ag06-local.key             -out /tmp/ag06-local.crt             -days 1             -subj '/CN=localhost'             -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          AG06_TEST_TLS_KEY=/tmp/ag06-local.key           AG06_TEST_TLS_CERT=/tmp/ag06-local.crt             node scripts/ag06/newsroom-test-server.js > /tmp/ag06-newsroom-server.log 2>&1 &
          echo $! > /tmp/ag06-newsroom-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --insecure --fail https://localhost:4173/newsroom.html >/dev/null; then
              echo "AG06_EXACT_BRANCH_GATEWAY_READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ag06-newsroom-server.log
          exit 1
      - name: Direct API/RLS attacks + Newsroom journeys
        shell: bash
        run: |
          set -o pipefail
          npm run test:ag06:live || {
            echo '--- AG-06 certification gateway diagnostics ---'
            cat /tmp/ag06-newsroom-server.log || true
            exit 1
          }
      - name: Expose certified AG-06 public story to NM-04 platform jobs
        id: nm04-stage
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/nm04-native-fixture.json
          node - <<'NODE'
          const fs=require("fs");
          const e=JSON.parse(fs.readFileSync("/tmp/nm04-native-fixture.json","utf8"));
          for(const key of ["story_id","slug","title","author_name","published_at","featured_public_url","featured_checksum","body_text","alt_text","caption","credit"]){
            if(!e[key]) throw new Error("Missing NM-04 evidence field: "+key);
          }
          const lines=[
            ["story_id",e.story_id],
            ["slug",e.slug],
            ["title",e.title],
            ["author_name",e.author_name],
            ["published_at",e.published_at],
            ["featured_public_url",e.featured_public_url],
            ["featured_checksum",e.featured_checksum],
            ["body_text",e.body_text],
            ["alt_text",e.alt_text],
            ["caption",e.caption],
            ["credit",e.credit]
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT,lines.map(([k,v])=>k+"="+String(v)).join("\n")+"\n");
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: nm04-native-reader-fixture
          path: /tmp/nm04-native-fixture.json
          if-no-files-found: error
          retention-days: 30
      - name: Stop exact-branch Newsroom gateway
        if: always()
        shell: bash
        run: |
          test -f /tmp/ag06-newsroom-server.pid && kill "$(cat /tmp/ag06-newsroom-server.pid)" || true


  nm04-reader-web:
    name: NM-04 Web desktop + mobile PWA native Reader evidence
    needs: live-staging-security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: staging
      EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
      EXPO_PUBLIC_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
      NM04_STORY_ID: ${{ needs.live-staging-security.outputs.story_id }}
      NM04_SLUG: ${{ needs.live-staging-security.outputs.slug }}
      NM04_TITLE: ${{ needs.live-staging-security.outputs.title }}
      NM04_AUTHOR_NAME: ${{ needs.live-staging-security.outputs.author_name }}
      NM04_PUBLISHED_AT: ${{ needs.live-staging-security.outputs.published_at }}
      NM04_PUBLIC_URL: ${{ needs.live-staging-security.outputs.featured_public_url }}
      NM04_CHECKSUM: ${{ needs.live-staging-security.outputs.featured_checksum }}
      NM04_BODY_TEXT: ${{ needs.live-staging-security.outputs.body_text }}
      NM04_ALT_TEXT: ${{ needs.live-staging-security.outputs.alt_text }}
      NM04_CAPTION: ${{ needs.live-staging-security.outputs.caption }}
      NM04_CREDIT: ${{ needs.live-staging-security.outputs.credit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-audit --no-fund
          npm install --prefix apps/mobile --no-audit --no-fund
      - name: Build staging Web/PWA
        run: |
          npm --prefix apps/mobile run export:web -- --clear
          node scripts/web/prepare-phase4-vercel.js
      - run: npx playwright install --with-deps chromium
      - name: Capture exact native story on desktop and mobile PWA viewport
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p nm04-evidence/web
          node scripts/web/phase4-smoke-server.js >/tmp/nm04-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            if [[ "$attempt" == "20" ]]; then cat /tmp/nm04-web.log; exit 1; fi
            sleep 1
          done
          node - <<'NODE'
          const { chromium }=require("@playwright/test");
          const fs=require("fs");
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const screens=[];
            for(const item of [
              {name:"desktop",width:1440,height:1000},
              {name:"mobile-pwa",width:390,height:844}
            ]){
              const page=await browser.newPage({viewport:{width:item.width,height:item.height}});
              const response=await page.goto("http://127.0.0.1:4174/article/"+process.env.NM04_SLUG,{waitUntil:"domcontentloaded",timeout:30000});
              if(!response?.ok()) throw new Error(item.name+" article HTTP "+response?.status());
              await page.waitForFunction(
                values => values.every(value => (document.body?.innerText ?? "").includes(value)),
                [process.env.NM04_TITLE,process.env.NM04_AUTHOR_NAME,"Published",process.env.NM04_BODY_TEXT,process.env.NM04_CAPTION,process.env.NM04_CREDIT],
                {timeout:30000}
              );
              const labeled=page.getByLabel(process.env.NM04_ALT_TEXT);
              let image=null;
              for(let index=0;index<await labeled.count();index+=1){
                const candidate=labeled.nth(index);
                if(await candidate.isVisible()){ image=candidate; break; }
              }
              if(!image) throw new Error("Visible certified Reader image was not found.");
              const media=await image.evaluate((element)=>{
                const nodes=[element,...element.querySelectorAll("*")];
                return nodes.flatMap(node=>[
                  node.getAttribute?.("src"),
                  node.getAttribute?.("srcset"),
                  node.getAttribute?.("style"),
                  getComputedStyle(node).backgroundImage
                ]).filter(Boolean);
              });
              const expected=process.env.NM04_PUBLIC_URL;
              const loadedResources=await page.evaluate(
                ()=>performance.getEntriesByType("resource").map(entry=>entry.name)
              );
              const renderedMedia=[...media,...loadedResources].join("\n");
              if(!renderedMedia.includes(expected)) throw new Error("Reader image URL mismatch: "+JSON.stringify({media,loadedResources}));
              const body=await page.locator("body").innerText();
              if(body.includes("newsroom-private")) throw new Error("private Newsroom reference leaked to Reader");
              const file="nm04-evidence/web/"+item.name+".png";
              await page.screenshot({path:file,fullPage:true});
              screens.push({...item,file,url:page.url()});
              await page.close();
            }
            fs.writeFileSync("nm04-evidence/web/manifest.json",JSON.stringify({
              sha:process.env.EXPECTED_SHA,
              storyId:process.env.NM04_STORY_ID,
              slug:process.env.NM04_SLUG,
              publicUrl:process.env.NM04_PUBLIC_URL,
              checksum:process.env.NM04_CHECKSUM,
              authorName:process.env.NM04_AUTHOR_NAME,
              publishedAt:process.env.NM04_PUBLISHED_AT,
              screens
            },null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nm04-native-reader-web-pwa
          path: |
            nm04-evidence/web/
            /tmp/nm04-web.log
          if-no-files-found: error
          retention-days: 30

  nm04-reader-ios:
    name: NM-04 iPhone + iPad native Reader evidence
    needs: live-staging-security
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      APP_ENV: staging
      EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
      EXPO_PUBLIC_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
      NM04_STORY_ID: ${{ needs.live-staging-security.outputs.story_id }}
      NM04_SLUG: ${{ needs.live-staging-security.outputs.slug }}
      NM04_TITLE: ${{ needs.live-staging-security.outputs.title }}
      NM04_AUTHOR_NAME: ${{ needs.live-staging-security.outputs.author_name }}
      NM04_PUBLISHED_AT: ${{ needs.live-staging-security.outputs.published_at }}
      NM04_PUBLIC_URL: ${{ needs.live-staging-security.outputs.featured_public_url }}
      NM04_CHECKSUM: ${{ needs.live-staging-security.outputs.featured_checksum }}
      NM04_BODY_TEXT: ${{ needs.live-staging-security.outputs.body_text }}
      NM04_ALT_TEXT: ${{ needs.live-staging-security.outputs.alt_text }}
      NM04_CAPTION: ${{ needs.live-staging-security.outputs.caption }}
      NM04_CREDIT: ${{ needs.live-staging-security.outputs.credit }}
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --prefix apps/mobile --no-audit --no-fund
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version
      - name: Build signed staging simulator app
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile
          npx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          WORKSPACE_NAME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -list -json -workspace "$WORKSPACE" > xcode-list.json
          SCHEME=$(WORKSPACE_NAME="$WORKSPACE_NAME" python3 - <<'PY'
          import json, os
          data=json.load(open('xcode-list.json'))
          schemes=data.get('workspace',{}).get('schemes',[])
          preferred=os.environ['WORKSPACE_NAME']
          print(preferred if preferred in schemes else [s for s in schemes if not s.startswith(('EX','Pods-','React','ExpoModules','RN'))][0])
          PY
          )
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -derivedDataPath "$PWD/DerivedData" build
          APP=$(find DerivedData/Build/Products/Release-iphonesimulator -maxdepth 2 -type d -name '*.app' -print -quit)
          test -n "$APP"
          echo "IOS_APP=$PWD/$APP" >> "$GITHUB_ENV"
      - name: Capture same native story on iPhone and iPad
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.maestro/bin:$PATH"
          export MAESTRO_CLI_NO_ANALYTICS=1
          ROOT="$PWD/nm04-evidence/ios"
          mkdir -p "$ROOT/iphone" "$ROOT/ipad"
          PHONE_UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for items in d.values() for x in items if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          IPAD_UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for items in d.values() for x in items if x.get("isAvailable") and x["name"].startswith("iPad")))')
          capture_device() {
            local udid="$1"
            local kind="$2"
            local out="$ROOT/$kind"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl ui "$udid" appearance light
            xcrun simctl install "$udid" "$IOS_APP"
            cat > "$RUNNER_TEMP/nm04-header-$kind.yaml" <<YAML
          appId: zw.co.healthtimes.app.staging
          ---
          - launchApp
          - openLink: "healthtimes://article/$NM04_SLUG"
          - extendedWaitUntil:
              visible: "$NM04_TITLE"
              timeout: 30000
          - assertVisible: "$NM04_AUTHOR_NAME"
          - assertVisible: "Published"
          - assertVisible: "$NM04_CAPTION"
          - assertVisible: "$NM04_CREDIT"
          YAML
            maestro --device "$udid" test "$RUNNER_TEMP/nm04-header-$kind.yaml"
            xcrun simctl io "$udid" screenshot "$out/article-header.png"
            cat > "$RUNNER_TEMP/nm04-body-$kind.yaml" <<YAML
          appId: zw.co.healthtimes.app.staging
          ---
          - launchApp
          - openLink: "healthtimes://article/$NM04_SLUG"
          - extendedWaitUntil:
              visible: "$NM04_TITLE"
              timeout: 30000
          - scroll
          - scroll
          - scroll
          - extendedWaitUntil:
              visible: "$NM04_BODY_TEXT"
              timeout: 30000
          YAML
            maestro --device "$udid" test "$RUNNER_TEMP/nm04-body-$kind.yaml"
            xcrun simctl io "$udid" screenshot "$out/article-body.png"
            xcrun simctl spawn "$udid" log show --style compact --last 10m --predicate 'process == "HealthTimesStaging" AND (eventMessage CONTAINS[c] "KeyChainException" OR eventMessage CONTAINS[c] "FunctionCallException")' > "$out/runtime.log" || true
            if grep -Eiq 'KeyChainException|FunctionCallException' "$out/runtime.log"; then cat "$out/runtime.log"; exit 1; fi
            KIND="$kind" UDID="$udid" EVIDENCE_SHA="$EXPECTED_SHA" python3 - <<'PY' > "$out/manifest.json"
          import json, os
          print(json.dumps({
            "sha":os.environ["EVIDENCE_SHA"],
            "deviceClass":os.environ["KIND"],
            "udid":os.environ["UDID"],
            "storyId":os.environ["NM04_STORY_ID"],
            "slug":os.environ["NM04_SLUG"],
            "publicUrl":os.environ["NM04_PUBLIC_URL"],
            "checksum":os.environ["NM04_CHECKSUM"],
            "authorName":os.environ["NM04_AUTHOR_NAME"],
            "publishedAt":os.environ["NM04_PUBLISHED_AT"],
            "screens":["article-header.png","article-body.png"]
          },indent=2))
          PY
            xcrun simctl shutdown "$udid" || true
          }
          capture_device "$PHONE_UDID" iphone
          capture_device "$IPAD_UDID" ipad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nm04-native-reader-ios-ipad
          path: nm04-evidence/ios/
          if-no-files-found: error
          retention-days: 30

  nm04-reader-android:
    name: NM-04 Android tablet native Reader evidence
    needs: live-staging-security
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_ENV: staging
      EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
      EXPO_PUBLIC_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
      NM04_STORY_ID: ${{ needs.live-staging-security.outputs.story_id }}
      NM04_SLUG: ${{ needs.live-staging-security.outputs.slug }}
      NM04_TITLE: ${{ needs.live-staging-security.outputs.title }}
      NM04_AUTHOR_NAME: ${{ needs.live-staging-security.outputs.author_name }}
      NM04_PUBLISHED_AT: ${{ needs.live-staging-security.outputs.published_at }}
      NM04_PUBLIC_URL: ${{ needs.live-staging-security.outputs.featured_public_url }}
      NM04_CHECKSUM: ${{ needs.live-staging-security.outputs.featured_checksum }}
      NM04_BODY_TEXT: ${{ needs.live-staging-security.outputs.body_text }}
      NM04_ALT_TEXT: ${{ needs.live-staging-security.outputs.alt_text }}
      NM04_CAPTION: ${{ needs.live-staging-security.outputs.caption }}
      NM04_CREDIT: ${{ needs.live-staging-security.outputs.credit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --prefix apps/mobile --no-audit --no-fund
      - name: Build staging Android release APK
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile
          npx expo prebuild --platform android --clean --no-install
          cd android
          printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\n' >> gradle.properties
          ./gradlew assembleRelease --no-daemon --max-workers=2
      - name: Capture same native story on Android tablet
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/nm04-avd"
          OUT="$PWD/nm04-evidence/android-tablet"
          APP_ID="zw.co.healthtimes.app.staging"
          mkdir -p "$ANDROID_AVD_HOME" "$OUT"

          capture_android_diagnostics() {
            adb shell dumpsys activity activities > "$OUT/activity-state.txt" 2>&1 || true
            adb shell dumpsys package "$APP_ID" > "$OUT/package-state.txt" 2>&1 || true
            adb logcat -d -v threadtime > "$OUT/app-logcat.txt" 2>&1 || true
            adb exec-out screencap -p > "$OUT/failure.png" 2>/dev/null || true
            adb shell uiautomator dump /sdcard/nm04-failure-ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/nm04-failure-ui.xml "$OUT/failure-ui.xml" >/dev/null 2>&1 || true
          }
          trap 'status=$?; if [[ "$status" -ne 0 ]]; then capture_android_diagnostics; fi; exit "$status"' EXIT

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          SYSTEM_IMAGE="system-images;android-35;default;x86_64"
          "$SDKMANAGER" "platform-tools" "emulator" "$SYSTEM_IMAGE"
          DEVICE_LIST="$("$AVDMANAGER" list device)"
          if printf '%s\n' "$DEVICE_LIST" | grep -q 'or "Nexus 10"'; then TABLET_PROFILE="Nexus 10"; else TABLET_PROFILE="pixel_c"; fi
          echo no | "$AVDMANAGER" create avd -n nm04tablet -k "$SYSTEM_IMAGE" --device "$TABLET_PROFILE" --force
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm || true; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd nm04tablet -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics >/tmp/nm04-android.log 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            adb devices | awk 'NR>1 && $2=="device" {found=1} END {exit found?0:1}' && break
            kill -0 "$emulator_pid" 2>/dev/null || { cat /tmp/nm04-android.log; exit 1; }
            sleep 2
          done
          for attempt in $(seq 1 120); do
            [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && break
            sleep 2
          done
          adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          adb shell am start -W -a android.intent.action.VIEW -d "healthtimes://article/$NM04_SLUG" -n "$APP_ID/.MainActivity" | tee "$OUT/deep-link-command.txt"

          dump_ui() {
            adb shell uiautomator dump /sdcard/nm04-ui.xml >/dev/null
            adb pull /sdcard/nm04-ui.xml "$OUT/current-ui.xml" >/dev/null
          }

          found=0
          first_dump=0
          for attempt in $(seq 1 60); do
            dump_ui
            if [[ "$first_dump" == "0" ]]; then
              cp "$OUT/current-ui.xml" "$OUT/first-ui.xml"
              first_dump=1
            fi
            if grep -Fq "$NM04_TITLE" "$OUT/current-ui.xml"; then found=1; break; fi
            if grep -Fq "Article not found." "$OUT/current-ui.xml"; then cat "$OUT/current-ui.xml"; exit 1; fi
            sleep 2
          done
          test "$found" = "1"
          cp "$OUT/current-ui.xml" "$OUT/article-header-ui.xml"
          grep -Fq "$NM04_AUTHOR_NAME" "$OUT/article-header-ui.xml"
          grep -Fq "Published" "$OUT/article-header-ui.xml"
          grep -Fq "$NM04_ALT_TEXT" "$OUT/article-header-ui.xml"
          ! grep -Fq "newsroom-private" "$OUT/article-header-ui.xml"
          adb exec-out screencap -p > "$OUT/article-header.png"

          media_found=0
          for attempt in $(seq 1 8); do
            if grep -Fq "$NM04_CAPTION" "$OUT/current-ui.xml" && grep -Fq "$NM04_CREDIT" "$OUT/current-ui.xml"; then
              media_found=1
              break
            fi
            adb shell input swipe 600 1600 600 450 450
            sleep 1
            dump_ui
          done
          test "$media_found" = "1"
          cp "$OUT/current-ui.xml" "$OUT/article-media-ui.xml"
          adb exec-out screencap -p > "$OUT/article-media.png"

          body_found=0
          for attempt in $(seq 1 10); do
            if grep -Fq "$NM04_BODY_TEXT" "$OUT/current-ui.xml"; then body_found=1; break; fi
            adb shell input swipe 600 1600 600 350 450
            sleep 1
            dump_ui
          done
          test "$body_found" = "1"
          cp "$OUT/current-ui.xml" "$OUT/article-body-ui.xml"
          adb exec-out screencap -p > "$OUT/article-body.png"

          EVIDENCE_SHA="$EXPECTED_SHA" TABLET_PROFILE="$TABLET_PROFILE" python3 - <<'PY' > "$OUT/manifest.json"
          import json, os
          print(json.dumps({
            "sha":os.environ["EVIDENCE_SHA"],
            "deviceClass":"android-tablet",
            "tabletProfile":os.environ["TABLET_PROFILE"],
            "storyId":os.environ["NM04_STORY_ID"],
            "slug":os.environ["NM04_SLUG"],
            "publicUrl":os.environ["NM04_PUBLIC_URL"],
            "checksum":os.environ["NM04_CHECKSUM"],
            "authorName":os.environ["NM04_AUTHOR_NAME"],
            "publishedAt":os.environ["NM04_PUBLISHED_AT"],
            "screens":["article-header.png","article-media.png","article-body.png"]
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nm04-native-reader-android-tablet
          path: |
            nm04-evidence/android-tablet/
            /tmp/nm04-android.log
          if-no-files-found: error
          retention-days: 30

  nm04-native-reader-cleanup:
    name: NM-04 cleanup staging certification residue
    needs:
      - live-staging-security
      - nm04-reader-web
      - nm04-reader-ios
      - nm04-reader-android
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AG06_STAGING_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove bounded NM-04/AG-06 staging identities, stories and media
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=healthtimes-ag06-certification"
          oidc_token="$(curl --silent --show-error --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$oidc_url" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          echo "::add-mask::$oidc_token"
          payload="$(node -e 'const [run,attempt]=process.argv.slice(1);process.stdout.write(JSON.stringify({action:"cleanup",run_id:run,run_attempt:attempt}))' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          code="$(curl --silent --show-error -o /tmp/nm04-cleanup.json -w '%{http_code}' -X POST "$AG06_STAGING_SUPABASE_URL/functions/v1/ag06-certification-provision" -H "Authorization: Bearer $oidc_token" -H "Content-Type: application/json" --data "$payload")"
          cat /tmp/nm04-cleanup.json
          test "$code" = "200"
          node - <<'NODE'
          const fs=require("fs");
          const result=JSON.parse(fs.readFileSync("/tmp/nm04-cleanup.json","utf8"));
          if(!result.ok) throw new Error("cleanup did not report ok");
          if(result.live_sessions_remaining!==0) throw new Error("live sessions remain");
          if(result.certification_story_rows_remaining!==0) throw new Error("certification story rows remain");
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nm04-native-reader-cleanup
          path: /tmp/nm04-cleanup.json
          if-no-files-found: error
          retention-days: 30
