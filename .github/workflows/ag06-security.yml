name: AG-06 Newsroom Security

on:
  pull_request:
    paths:
      - 'api/newsroom.js'
      - 'newsroom.js'
      - 'newsroom.html'
      - 'newsroom.css'
      - 'vercel.json'
      - 'supabase/migrations/**'
      - 'tests/ag06-*.spec.js'
      - 'tests/newsroom-os.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/ag06-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: AG-06 static authorization contract
        run: npm run test:ag06:contract
      - name: Secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -nE 'eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{20,}' -- ':!package-lock.json'
          ! git grep -nE 'postgres(ql)?://[^[:space:]@]+:[^[:space:]@]+@' -- ':!docs/**'
          ! git grep -nE 'HealthTimes#(Publisher|Editor|Reporter|Commercial|Audience)[0-9]+' -- newsroom.js newsroom.html api || true
          if git grep -nE 'HealthTimes#(Publisher|Editor|Reporter|Commercial|Audience)[0-9]+' -- newsroom.js newsroom.html api; then
            echo 'Legacy demo credential literal detected in runtime code.'
            exit 1
          fi

  disposable-supabase-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then
            npx --yes supabase@2.117.0 init
          fi
      - name: Start disposable Supabase
        run: npx --yes supabase@2.117.0 start
      - name: Apply all migrations from zero
        run: npx --yes supabase@2.117.0 db reset --local
      - name: Stop disposable Supabase
        if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup || true

  local-newsroom-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Unauthenticated gateway and local regression
        run: npx playwright test tests/newsroom-os.spec.js

  live-staging-security:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AG06_STAGING_BASE_URL: http://localhost:4173
      AG06_STAGING_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
      AG06_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
      PLAYWRIGHT_BASE_URL: http://localhost:4173
      SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require bounded HealthTimes Staging configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AG06_STAGING_SUPABASE_URL" == *"gcdohgbmqhqwydgaxrcr"* ]] || { echo "Refusing non-HealthTimes-Staging Supabase project."; exit 1; }
          [[ "$SUPABASE_URL" == "$AG06_STAGING_SUPABASE_URL" ]] || { echo "Newsroom gateway and live RLS target differ."; exit 1; }
      - name: Prepare ephemeral staging Auth coordinates
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts bcryptjs@2.4.3 >/dev/null 2>&1
          tag="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          : > /tmp/ag06-activation-manifest.txt
          for role in reporter editor commercial publisher; do
            upper="$(printf '%s' "$role" | tr '[:lower:]' '[:upper:]')"
            email="ag06-${role}-${tag}@healthtimes.co.zw"
            password="Ht!$(openssl rand -hex 18)Aa7"
            hash="$(node -e 'const bcrypt=require("bcryptjs"); process.stdout.write(bcrypt.hashSync(process.argv[1],10))' "$password")"
            echo "::add-mask::$password"
            echo "AG06_${upper}_EMAIL=$email" >> "$GITHUB_ENV"
            echo "AG06_${upper}_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "$role|$email|$hash" >> /tmp/ag06-activation-manifest.txt
            echo "AG06_STAGING_IDENTITY_COORD role=$role email=$email"
          done
      - name: Upload activation manifest
        uses: actions/upload-artifact@v4
        with:
          name: ag06-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/ag06-activation-manifest.txt
          if-no-files-found: error
          retention-days: 1
      - name: Wait for moderator role activation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            all_ready=1
            for role in REPORTER EDITOR COMMERCIAL PUBLISHER; do
              email_var="AG06_${role}_EMAIL"
              password_var="AG06_${role}_PASSWORD"
              email="${!email_var}"
              password="${!password_var}"
              payload="$(node -e 'const [email,password]=process.argv.slice(1); process.stdout.write(JSON.stringify({email,password}))' "$email" "$password")"
              code="$(curl --silent --show-error -o "/tmp/ag06-${role}-login.json" -w '%{http_code}' \
                -X POST "$AG06_STAGING_SUPABASE_URL/auth/v1/token?grant_type=password" \
                -H "apikey: $AG06_STAGING_SUPABASE_PUBLISHABLE_KEY" \
                -H "Content-Type: application/json" \
                --data "$payload")"
              if [[ "$code" != "200" ]]; then all_ready=0; fi
            done
            if [[ "$all_ready" == "1" ]]; then
              echo "AG06_STAGING_AUTH_READY"
              exit 0
            fi
            echo "Waiting for bounded staging identities to be confirmed/mapped (attempt $attempt/36)..."
            sleep 10
          done
          echo "Timed out waiting for staging identity activation."
          exit 1
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start exact-branch Newsroom gateway
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ag06/newsroom-test-server.js > /tmp/ag06-newsroom-server.log 2>&1 &
          echo $! > /tmp/ag06-newsroom-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:4173/newsroom.html >/dev/null; then
              echo "AG06_EXACT_BRANCH_GATEWAY_READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ag06-newsroom-server.log
          exit 1
      - name: Direct API/RLS attacks + Newsroom journeys
        run: npm run test:ag06:live
      - name: Stop exact-branch Newsroom gateway
        if: always()
        shell: bash
        run: |
          test -f /tmp/ag06-newsroom-server.pid && kill "$(cat /tmp/ag06-newsroom-server.pid)" || true
