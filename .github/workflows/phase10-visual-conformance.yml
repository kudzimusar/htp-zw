name: Phase 10 Candidate Visual Conformance

on:
  push:
    branches:
      - integration/ag07-nm07-phase10-visual-conformance
      - integration/ag07-phase12-legacy-retirement-precp7
  pull_request:
  workflow_dispatch:

concurrency:
  group: phase10-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: staging
  EXPO_PUBLIC_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
  HEALTHTIMES_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  HEALTHTIMES_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
  HEALTHTIMES_WEB_BASE_URL: ""

jobs:
  candidate-web:
    name: Candidate Web/PWA conformance + screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: |
          npm install --no-audit --no-fund
          npm install --prefix apps/mobile --no-audit --no-fund
      - name: Run Phase 10 visual contract
        run: node --test apps/mobile/tests/phase10-visual-conformance.test.mjs
      - name: Typecheck shared Reader
        run: npm run typecheck --prefix apps/mobile
      - name: Build source-parity Web/PWA candidate
        env:
          EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: source-parity
        run: npm run build:phase4:web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture source-parity responsive matrix
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p phase10-evidence/after/web
          node scripts/web/phase4-smoke-server.js >/tmp/phase10-after-source-parity.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            if [[ "$attempt" == "10" ]]; then cat /tmp/phase10-after-source-parity.log; exit 1; fi
            sleep 1
          done
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs=require('fs');
          const path=require('path');
          const base='http://127.0.0.1:4174';
          const articleId='source-zimbabwe-strengthens-social-contracting-as-hiv-donor-funding-shrinks';
          const routes=[
            ['home','/'],['explore','/explore'],['search','/search'],['article','/article/'+articleId],
            ['live','/live'],['watch','/watch'],['listen','/listen'],['saved','/saved'],
            ['my-ht','/my'],['edition','/edition'],['premium','/premium'],
            ['notifications','/notifications'],['onboarding','/onboarding'],['studio','/studio']
          ];
          const viewports=[['mobile',390,844],['tablet',834,1112],['desktop',1440,1000]];
          const tabRoutes=new Set(['/','/explore','/live','/watch','/my']);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const manifest={sha:process.env.EXPECTED_SHA,capturedAt:new Date().toISOString(),screens:[]};
            for(const [vp,width,height] of viewports){
              for(const [name,route] of routes){
                const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
                const pageErrors=[];
                page.on('pageerror',error=>pageErrors.push(String(error)));
                const response=await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:30000});
                if(route==='/') await page.getByText('Top Stories',{exact:false}).first().waitFor({timeout:30000});
                else await page.waitForTimeout(1200);
                if(vp==='desktop' && tabRoutes.has(route)){
                  const tabs=await page.getByRole('tab').count();
                  if(tabs!==0) throw new Error('Desktop mobile tab bar still rendered on '+route+' count='+tabs);
                }
                if(vp==='mobile' && tabRoutes.has(route)){
                  const tabs=await page.getByRole('tab').count();
                  if(tabs<5) throw new Error('Mobile five-destination tab bar missing on '+route+' count='+tabs);
                }
                if(route==='/onboarding'){
                  const searchChrome=await page.getByLabel('Search HealthTimes').count();
                  if(searchChrome!==0) throw new Error('Onboarding still renders Reader utility chrome');
                }
                if(name==='article'){
                  const body=await page.locator('body').innerText();
                  if(body.includes('Canonical desk')||body.includes('Legacy source taxonomy')) throw new Error('Article exposes migration-internal taxonomy labels');
                }
                const hydrationWarnings=pageErrors.filter((error)=>error.includes('Minified React error #418'));
                const unexpectedErrors=pageErrors.filter((error)=>!error.includes('Minified React error #418'));
                if(hydrationWarnings.length) throw new Error(name+' hydration regeneration errors: '+hydrationWarnings.join(' | '));
                if(unexpectedErrors.length) throw new Error(name+' page errors: '+unexpectedErrors.join(' | '));
                const file=path.join('phase10-evidence/after/web',vp+'-'+name+'.png');
                await page.screenshot({path:file,fullPage:true});
                manifest.screens.push({viewport:vp,width,height,name,route,status:response?.status()??null,title:await page.title(),file,hydrationRegenerationWarnings:hydrationWarnings.length});
                await page.close();
              }
            }
            fs.writeFileSync('phase10-evidence/after/web/manifest.json',JSON.stringify(manifest,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          kill "$server_pid" 2>/dev/null || true
          trap - EXIT
      - name: Build staging-service candidate for HOSPAZ proof
        env:
          EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
        run: |
          rm -rf apps/mobile/.expo apps/mobile/node_modules/.cache
          npm --prefix apps/mobile run export:web -- --clear
          node scripts/web/prepare-phase4-vercel.js
      - name: Capture staging HOSPAZ Home proof
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p phase10-evidence/after/staging
          node scripts/web/phase4-smoke-server.js >/tmp/phase10-after-staging.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            if [[ "$attempt" == "10" ]]; then cat /tmp/phase10-after-staging.log; exit 1; fi
            sleep 1
          done
          node - <<'NODE'
          const { chromium }=require('@playwright/test');
          const fs=require('fs');
          const { buildHospazCapability }=require('./lib/ag05-capability');
          (async()=>{
            const rpcResponse=await fetch(process.env.EXPO_PUBLIC_SUPABASE_URL+'/rest/v1/rpc/ag05_hospaz_direct_ad_preview',{
              method:'POST',
              headers:{
                apikey:process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
                Authorization:'Bearer '+process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
                'Content-Type':'application/json'
              },
              body:'{}'
            });
            if(!rpcResponse.ok) throw new Error('HOSPAZ authority RPC HTTP '+rpcResponse.status);
            const raw=await rpcResponse.json();
            const capability=buildHospazCapability(raw,{supabaseUrl:process.env.EXPO_PUBLIC_SUPABASE_URL});
            if(capability.advertiser!=='HOSPAZ') throw new Error('HOSPAZ advertiser authority mismatch');
            if(capability.placementKey!=='hospaz-header-direct') throw new Error('HOSPAZ placement authority mismatch');
            if(capability.provenance.currentSourceAttachmentId!=='33005') throw new Error('HOSPAZ source attachment mismatch');
            if(capability.destination.state!=='UNKNOWN'||capability.destination.url!==null) throw new Error('HOSPAZ destination must remain UNKNOWN/null');
            if(capability.schedule.state!=='UNKNOWN'||capability.schedule.value!==null) throw new Error('HOSPAZ schedule must remain UNKNOWN/null');
            if(capability.placementConditions.state!=='UNKNOWN'||capability.placementConditions.value!==null) throw new Error('HOSPAZ placement conditions must remain UNKNOWN/null');
            const browser=await chromium.launch({headless:true});
            const manifest={
              sha:process.env.EXPECTED_SHA,
              capturedAt:new Date().toISOString(),
              authority:{
                advertiser:capability.advertiser,
                placement:capability.placementKey,
                sourceAttachment:capability.provenance.currentSourceAttachmentId,
                destination:capability.destination,
                schedule:capability.schedule,
                placementConditions:capability.placementConditions,
                nonClickable:capability.destination.url===null
              },
              screens:[]
            };
            for(const item of [{name:'mobile-home-hospaz',width:390,height:844},{name:'desktop-home-hospaz',width:1440,height:1000}]){
              const page=await browser.newPage({viewport:{width:item.width,height:item.height}});
              const errors=[]; const diagnostics=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',msg=>{ if(msg.type()==='error') diagnostics.push('console:'+msg.text()); });
              page.on('requestfailed',req=>diagnostics.push('requestfailed:'+req.url()+':'+(req.failure()?.errorText??'unknown')));
              await page.goto('http://127.0.0.1:4174/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.getByText('ACCEPTED MIGRATED CORPUS',{exact:false}).first().waitFor({timeout:30000});
              await page.getByText('Top Stories',{exact:false}).first().waitFor({timeout:30000});
              const ad=page.locator('[aria-label="Advertising placement hospaz-header-direct"]');
              try{
                await ad.waitFor({timeout:30000});
              }catch(error){
                const body=(await page.locator('body').innerText()).slice(0,4000);
                throw new Error('HOSPAZ placement did not render. diagnostics='+diagnostics.join(' | ')+' body='+body+' cause='+String(error));
              }
              const adText=await ad.innerText();
              if(!adText.includes('HOSPAZ')) throw new Error('HOSPAZ disclosure missing');
              if(await ad.locator('a').count()) throw new Error('HOSPAZ direct placement became clickable without verified destination');
              if(errors.length) throw new Error(errors.join(' | '));
              const file='phase10-evidence/after/staging/'+item.name+'.png';
              await page.screenshot({path:file,fullPage:true});
              manifest.screens.push({...item,file,disclosure:adText});
              await page.close();
            }
            fs.writeFileSync('phase10-evidence/after/staging/manifest.json',JSON.stringify(manifest,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase10-candidate-web-pwa-screenshots
          path: |
            phase10-evidence/after/
            /tmp/phase10-after-source-parity.log
            /tmp/phase10-after-staging.log
          if-no-files-found: error
          retention-days: 30

  candidate-ios:
    name: Candidate iOS Simulator screenshots
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix apps/mobile --no-audit --no-fund
      - name: Generate staging iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build simulator app
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          WORKSPACE_NAME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -list -json -workspace "$WORKSPACE" > xcode-list.json
          SCHEME=$(WORKSPACE_NAME="$WORKSPACE_NAME" python3 - <<'PY'
          import json, os
          data=json.load(open('xcode-list.json'))
          schemes=data.get('workspace',{}).get('schemes',[])
          preferred=os.environ['WORKSPACE_NAME']
          print(preferred if preferred in schemes else [s for s in schemes if not s.startswith(('EX','Pods-','React','ExpoModules','RN'))][0])
          PY
          )
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -derivedDataPath "$PWD/DerivedData" build
          APP=$(find DerivedData/Build/Products/Release-iphonesimulator -maxdepth 2 -type d -name '*.app' -print -quit)
          test -n "$APP"
          echo "IOS_APP=$PWD/$APP" >> "$GITHUB_ENV"
      - name: Capture iOS Reader
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p phase10-evidence/after/ios
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime,items in d.items() for x in items if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$IOS_APP"
          xcrun simctl launch "$UDID" zw.co.healthtimes.app.staging
          sleep 20
          codesign -d --entitlements :- "$IOS_APP" > phase10-evidence/after/ios/app-entitlements.plist 2>&1 || true
          xcrun simctl spawn "$UDID" log show --style compact --last 3m --predicate 'process == "HealthTimesStaging" AND (eventMessage CONTAINS[c] "KeyChainException" OR eventMessage CONTAINS[c] "A required entitlement" OR eventMessage CONTAINS[c] "FunctionCallException")' > phase10-evidence/after/ios/runtime.log || true
          grep -Ev 'log run noninteractively|args:.*eventMessage|predicate' phase10-evidence/after/ios/runtime.log > phase10-evidence/after/ios/runtime-errors.log || true
          if grep -Eiq 'KeyChainException|A required entitlement|FunctionCallException' phase10-evidence/after/ios/runtime-errors.log; then
            cat phase10-evidence/after/ios/runtime-errors.log
            echo "::error::iOS staging Reader hit a SecureStore/Keychain runtime failure."
            exit 1
          fi
          xcrun simctl io "$UDID" screenshot phase10-evidence/after/ios/home.png
          xcrun simctl openurl "$UDID" "healthtimes://premium" || true
          sleep 4
          xcrun simctl io "$UDID" screenshot phase10-evidence/after/ios/premium.png
          xcrun simctl openurl "$UDID" "healthtimes://watch" || true
          sleep 4
          xcrun simctl io "$UDID" screenshot phase10-evidence/after/ios/watch.png
          printf '{"sha":"%s","udid":"%s","capturedAt":"%s"}\n' "$EXPECTED_SHA" "$UDID" "$(date -u +%FT%TZ)" > phase10-evidence/after/ios/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase10-candidate-ios-screenshots
          path: phase10-evidence/after/ios/
          if-no-files-found: error
          retention-days: 30

  candidate-android:
    name: Candidate Android emulator screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --prefix apps/mobile --no-audit --no-fund
      - name: Generate staging Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build staging debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Boot emulator and capture Reader
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/phase10-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd -n phase10candidate -k "system-images;android-35;google_apis;x86_64" --force
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/phase10candidate.ini"
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm || true; fi
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd phase10candidate -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics >/tmp/phase10-candidate-emulator.log 2>&1 &
          emulator_pid=$!
          device_ready=0
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android emulator exited before adb registered a device"
              cat /tmp/phase10-candidate-emulator.log
              exit 1
            fi
            if adb devices | awk 'NR>1 && $2=="device" {found=1} END {exit found?0:1}'; then
              device_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$device_ready" != "1" ]]; then
            echo "Android emulator did not register with adb"
            adb devices -l || true
            cat /tmp/phase10-candidate-emulator.log
            exit 1
          fi
          boot_ready=0
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              boot_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$boot_ready" != "1" ]]; then
            echo "Android emulator registered but did not complete boot"
            adb devices -l || true
            cat /tmp/phase10-candidate-emulator.log
            exit 1
          fi
          adb shell input keyevent 82 || true
          mkdir -p phase10-evidence/after/android
          adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          adb shell monkey -p zw.co.healthtimes.app.staging -c android.intent.category.LAUNCHER 1
          sleep 20
          adb shell uiautomator dump /sdcard/phase10-home.xml >/dev/null
          adb pull /sdcard/phase10-home.xml phase10-evidence/after/android/home-ui.xml >/dev/null
          if grep -q 'Loading Home' phase10-evidence/after/android/home-ui.xml; then
            cat phase10-evidence/after/android/home-ui.xml
            echo "::error::Android staging Reader remained on Loading Home after 20 seconds."
            exit 1
          fi
          if grep -Eiq 'HealthTimes staging Supabase configuration is missing|FunctionCallException|Unhandled|Error:' phase10-evidence/after/android/home-ui.xml; then
            cat phase10-evidence/after/android/home-ui.xml
            echo "::error::Android staging Reader rendered an application error instead of Home."
            exit 1
          fi
          adb exec-out screencap -p > phase10-evidence/after/android/home.png
          adb shell am start -a android.intent.action.VIEW -d "healthtimes://premium" zw.co.healthtimes.app.staging || true
          sleep 4
          adb exec-out screencap -p > phase10-evidence/after/android/premium.png
          adb shell am start -a android.intent.action.VIEW -d "healthtimes://watch" zw.co.healthtimes.app.staging || true
          sleep 4
          adb exec-out screencap -p > phase10-evidence/after/android/watch.png
          printf '{"sha":"%s","capturedAt":"%s"}\n' "$EXPECTED_SHA" "$(date -u +%FT%TZ)" > phase10-evidence/after/android/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-candidate-android-screenshots
          path: |
            phase10-evidence/after/android/
            /tmp/phase10-candidate-emulator.log
          if-no-files-found: error
          retention-days: 30
