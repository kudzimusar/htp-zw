name: Phase 10 Candidate Visual Conformance

on:
  push:
    branches:
      - integration/ag07-nm07-phase10-visual-conformance
      - integration/ag07-phase12-legacy-retirement-precp7
  pull_request:
  workflow_dispatch:

concurrency:
  group: phase10-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: staging
  EXPO_PUBLIC_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
  HEALTHTIMES_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  HEALTHTIMES_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
  HEALTHTIMES_WEB_BASE_URL: ""

jobs:
  candidate-web:
    name: Candidate Web/PWA conformance + screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: |
          npm install --no-audit --no-fund
          npm install --prefix apps/mobile --no-audit --no-fund
      - name: Run Phase 10 visual contract
        run: node --test apps/mobile/tests/phase10-visual-conformance.test.mjs
      - name: Typecheck shared Reader
        run: npm run typecheck --prefix apps/mobile
      - name: Build source-parity Web/PWA candidate
        env:
          EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: source-parity
        run: npm run build:phase4:web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture source-parity responsive matrix
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p phase10-evidence/after/web
          node scripts/web/phase4-smoke-server.js >/tmp/phase10-after-source-parity.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            if [[ "$attempt" == "10" ]]; then cat /tmp/phase10-after-source-parity.log; exit 1; fi
            sleep 1
          done
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs=require('fs');
          const path=require('path');
          const base='http://127.0.0.1:4174';
          const articleId='source-zimbabwe-strengthens-social-contracting-as-hiv-donor-funding-shrinks';
          const routes=[
            ['home','/'],['explore','/explore'],['search','/search'],['article','/article/'+articleId],
            ['live','/live'],['watch','/watch'],['listen','/listen'],['saved','/saved'],
            ['my-ht','/my'],['edition','/edition'],['premium','/premium'],
            ['notifications','/notifications'],['onboarding','/onboarding'],['studio','/studio']
          ];
          const viewports=[['mobile',390,844],['tablet',834,1112],['desktop',1440,1000]];
          const tabRoutes=new Set(['/','/explore','/live','/watch','/my']);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const manifest={sha:process.env.EXPECTED_SHA,capturedAt:new Date().toISOString(),screens:[]};
            for(const [vp,width,height] of viewports){
              for(const [name,route] of routes){
                const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
                const pageErrors=[];
                page.on('pageerror',error=>pageErrors.push(String(error)));
                const response=await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:30000});
                if(route==='/') await page.getByText('Top Stories',{exact:false}).first().waitFor({timeout:30000});
                else await page.waitForTimeout(1200);
                if(vp==='desktop' && tabRoutes.has(route)){
                  const tabs=await page.getByRole('tab').count();
                  if(tabs!==0) throw new Error('Desktop mobile tab bar still rendered on '+route+' count='+tabs);
                }
                if(vp==='mobile' && tabRoutes.has(route)){
                  const tabs=await page.getByRole('tab').count();
                  if(tabs<5) throw new Error('Mobile five-destination tab bar missing on '+route+' count='+tabs);
                }
                if(route==='/onboarding'){
                  const searchChrome=await page.getByLabel('Search HealthTimes').count();
                  if(searchChrome!==0) throw new Error('Onboarding still renders Reader utility chrome');
                }
                if(name==='article'){
                  const body=await page.locator('body').innerText();
                  if(body.includes('Canonical desk')||body.includes('Legacy source taxonomy')) throw new Error('Article exposes migration-internal taxonomy labels');
                }
                const hydrationWarnings=pageErrors.filter((error)=>error.includes('Minified React error #418'));
                const unexpectedErrors=pageErrors.filter((error)=>!error.includes('Minified React error #418'));
                if(hydrationWarnings.length) throw new Error(name+' hydration regeneration errors: '+hydrationWarnings.join(' | '));
                if(unexpectedErrors.length) throw new Error(name+' page errors: '+unexpectedErrors.join(' | '));
                const file=path.join('phase10-evidence/after/web',vp+'-'+name+'.png');
                await page.screenshot({path:file,fullPage:true});
                manifest.screens.push({viewport:vp,width,height,name,route,status:response?.status()??null,title:await page.title(),file,hydrationRegenerationWarnings:hydrationWarnings.length});
                await page.close();
              }
            }
            fs.writeFileSync('phase10-evidence/after/web/manifest.json',JSON.stringify(manifest,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          kill "$server_pid" 2>/dev/null || true
          trap - EXIT
      - name: Build staging-service candidate for HOSPAZ proof
        env:
          EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
        run: |
          rm -rf apps/mobile/.expo apps/mobile/node_modules/.cache
          npm --prefix apps/mobile run export:web -- --clear
          node scripts/web/prepare-phase4-vercel.js
      - name: Capture staging HOSPAZ Home proof
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p phase10-evidence/after/staging
          node scripts/web/phase4-smoke-server.js >/tmp/phase10-after-staging.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            if [[ "$attempt" == "10" ]]; then cat /tmp/phase10-after-staging.log; exit 1; fi
            sleep 1
          done
          node - <<'NODE'
          const { chromium }=require('@playwright/test');
          const fs=require('fs');
          const { buildHospazCapability }=require('./lib/ag05-capability');
          (async()=>{
            const rpcResponse=await fetch(process.env.EXPO_PUBLIC_SUPABASE_URL+'/rest/v1/rpc/ag05_hospaz_direct_ad_preview',{
              method:'POST',
              headers:{
                apikey:process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
                Authorization:'Bearer '+process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
                'Content-Type':'application/json'
              },
              body:'{}'
            });
            if(!rpcResponse.ok) throw new Error('HOSPAZ authority RPC HTTP '+rpcResponse.status);
            const raw=await rpcResponse.json();
            const capability=buildHospazCapability(raw,{supabaseUrl:process.env.EXPO_PUBLIC_SUPABASE_URL});
            if(capability.advertiser!=='HOSPAZ') throw new Error('HOSPAZ advertiser authority mismatch');
            if(capability.placementKey!=='hospaz-header-direct') throw new Error('HOSPAZ placement authority mismatch');
            if(capability.provenance.currentSourceAttachmentId!=='33005') throw new Error('HOSPAZ source attachment mismatch');
            if(capability.destination.state!=='UNKNOWN'||capability.destination.url!==null) throw new Error('HOSPAZ destination must remain UNKNOWN/null');
            if(capability.schedule.state!=='UNKNOWN'||capability.schedule.value!==null) throw new Error('HOSPAZ schedule must remain UNKNOWN/null');
            if(capability.placementConditions.state!=='UNKNOWN'||capability.placementConditions.value!==null) throw new Error('HOSPAZ placement conditions must remain UNKNOWN/null');
            const browser=await chromium.launch({headless:true});
            const manifest={
              sha:process.env.EXPECTED_SHA,
              capturedAt:new Date().toISOString(),
              authority:{
                advertiser:capability.advertiser,
                placement:capability.placementKey,
                sourceAttachment:capability.provenance.currentSourceAttachmentId,
                destination:capability.destination,
                schedule:capability.schedule,
                placementConditions:capability.placementConditions,
                nonClickable:capability.destination.url===null
              },
              screens:[]
            };
            for(const item of [{name:'mobile-home-hospaz',width:390,height:844},{name:'desktop-home-hospaz',width:1440,height:1000}]){
              const page=await browser.newPage({viewport:{width:item.width,height:item.height}});
              const errors=[]; const diagnostics=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',msg=>{ if(msg.type()==='error') diagnostics.push('console:'+msg.text()); });
              page.on('requestfailed',req=>diagnostics.push('requestfailed:'+req.url()+':'+(req.failure()?.errorText??'unknown')));
              await page.goto('http://127.0.0.1:4174/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.getByText('ACCEPTED MIGRATED CORPUS',{exact:false}).first().waitFor({timeout:30000});
              await page.getByText('Top Stories',{exact:false}).first().waitFor({timeout:30000});
              const ad=page.locator('[aria-label="Advertising placement hospaz-header-direct"]');
              try{
                await ad.waitFor({timeout:30000});
              }catch(error){
                const body=(await page.locator('body').innerText()).slice(0,4000);
                throw new Error('HOSPAZ placement did not render. diagnostics='+diagnostics.join(' | ')+' body='+body+' cause='+String(error));
              }
              const adText=await ad.innerText();
              if(!adText.includes('HOSPAZ')) throw new Error('HOSPAZ disclosure missing');
              if(await ad.locator('a').count()) throw new Error('HOSPAZ direct placement became clickable without verified destination');
              if(errors.length) throw new Error(errors.join(' | '));
              const file='phase10-evidence/after/staging/'+item.name+'.png';
              await page.screenshot({path:file,fullPage:true});
              manifest.screens.push({...item,file,disclosure:adText});
              await page.close();
            }
            fs.writeFileSync('phase10-evidence/after/staging/manifest.json',JSON.stringify(manifest,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase10-candidate-web-pwa-screenshots
          path: |
            phase10-evidence/after/
            /tmp/phase10-after-source-parity.log
            /tmp/phase10-after-staging.log
          if-no-files-found: error
          retention-days: 30

  candidate-ios:
    name: Candidate iOS + iPad Simulator screenshots
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --prefix apps/mobile --no-audit --no-fund
      - name: Install Maestro simulator UI driver
        shell: bash
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version
      - name: Generate staging iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build simulator app
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          WORKSPACE_NAME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -list -json -workspace "$WORKSPACE" > xcode-list.json
          SCHEME=$(WORKSPACE_NAME="$WORKSPACE_NAME" python3 - <<'PY'
          import json, os
          data=json.load(open('xcode-list.json'))
          schemes=data.get('workspace',{}).get('schemes',[])
          preferred=os.environ['WORKSPACE_NAME']
          print(preferred if preferred in schemes else [s for s in schemes if not s.startswith(('EX','Pods-','React','ExpoModules','RN'))][0])
          PY
          )
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -derivedDataPath "$PWD/DerivedData" build
          APP=$(find DerivedData/Build/Products/Release-iphonesimulator -maxdepth 2 -type d -name '*.app' -print -quit)
          test -n "$APP"
          echo "IOS_APP=$PWD/$APP" >> "$GITHUB_ENV"
      - name: Capture exact-head iPhone and iPad Reader evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.maestro/bin:$PATH"
          export MAESTRO_CLI_NO_ANALYTICS=1
          APP_ID="zw.co.healthtimes.app.staging"
          resolve_article_id() {
            node <<'NODE'
          const base=process.env.EXPO_PUBLIC_SUPABASE_URL;
          const key=process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY;
          if(!base || !key) throw new Error("Staging Supabase configuration is required for native Article evidence.");
          const headers={apikey:key,Authorization:`Bearer ${key}`,"Content-Type":"application/json"};
          async function rpc(name,body){
            let last="";
            for(let attempt=1;attempt<=5;attempt++){
              const response=await fetch(`${base}/rest/v1/rpc/${name}`,{
                method:"POST",
                headers,
                body:JSON.stringify(body)
              });
              if(response.ok) return response.json();
              last=`HTTP ${response.status}: ${await response.text()}`;
              await new Promise((resolve)=>setTimeout(resolve,attempt*1000));
            }
            throw new Error(name+" failed after bounded retries: "+last);
          }
          (async()=>{
            const feed=await rpc("ag05_public_feed_rows",{p_limit:12});
            for(const row of feed ?? []){
              if(!row?.canonical_url) continue;
              let pathname;
              try{ pathname=new URL(row.canonical_url).pathname; }catch{ continue; }
              if(!pathname.endsWith("/")) pathname+="/";
              const document=await rpc("ag05_public_story_document",{p_path:pathname});
              if(document?.story_id){
                process.stdout.write(String(document.story_id));
                return;
              }
            }
            throw new Error("No current staging feed story resolved to an Article document.");
          })().catch((error)=>{
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
          }
          ARTICLE_ID="$(resolve_article_id)"
          test -n "$ARTICLE_ID"
          echo "EVIDENCE_ARTICLE_ID=$ARTICLE_ID"
          ROOT="$PWD/phase10-evidence/after/ios"
          FLOW_ROOT="$RUNNER_TEMP/phase10-maestro"
          mkdir -p "$ROOT/iphone" "$ROOT/ipad" "$FLOW_ROOT"

          DEVICE_JSON="$(xcrun simctl list devices available -j)"
          PHONE_UDID=$(printf '%s' "$DEVICE_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for _,items in d.items() for x in items if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          IPAD_UDID=$(printf '%s' "$DEVICE_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; prefs=("iPad Pro 13-inch","iPad Pro (12.9-inch)","iPad Air 13-inch","iPad Pro 11-inch"); xs=[x for _,items in d.items() for x in items if x.get("isAvailable") and x["name"].startswith("iPad")]; print(next((x["udid"] for p in prefs for x in xs if x["name"].startswith(p)),xs[0]["udid"]))')
          test -n "$PHONE_UDID"
          test -n "$IPAD_UDID"
          PHONE_NAME=$(printf '%s' "$DEVICE_JSON" | DEVICE="$PHONE_UDID" python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for _,items in d.items() for x in items if x["udid"]==os.environ["DEVICE"]))')
          IPAD_NAME=$(printf '%s' "$DEVICE_JSON" | DEVICE="$IPAD_UDID" python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for _,items in d.items() for x in items if x["udid"]==os.environ["DEVICE"]))')
          echo "PHONE_UDID=$PHONE_UDID PHONE_NAME=$PHONE_NAME"
          echo "IPAD_UDID=$IPAD_UDID IPAD_NAME=$IPAD_NAME"

          cat > "$FLOW_ROOT/home.yaml" <<YAML
          appId: $APP_ID
          ---
          - launchApp
          - extendedWaitUntil:
              visible: "For You"
              timeout: 45000
          YAML

          cat > "$FLOW_ROOT/premium.yaml" <<YAML
          appId: $APP_ID
          ---
          - openLink: "healthtimes://premium"
          - tapOn:
              text: "Open"
              optional: true
          - extendedWaitUntil:
              visible: "Deeper health intelligence. Full reporting. One clear membership."
              timeout: 45000
          YAML

          cat > "$FLOW_ROOT/watch.yaml" <<YAML
          appId: $APP_ID
          ---
          - openLink: "healthtimes://watch"
          - tapOn:
              text: "Open"
              optional: true
          - extendedWaitUntil:
              visible: "Watch HealthTimes interviews, explainers, investigations and health coverage."
              timeout: 45000
          YAML

          cat > "$FLOW_ROOT/article.yaml" <<YAML
          appId: $APP_ID
          ---
          - openLink: "healthtimes://article/$ARTICLE_ID"
          - tapOn:
              text: "Open"
              optional: true
          - extendedWaitUntil:
              visible: "Text 100%"
              timeout: 45000
          - assertNotVisible: "Loading article…"
          - assertNotVisible: "Article not found."
          YAML

          cat > "$FLOW_ROOT/text-scale.yaml" <<YAML
          appId: $APP_ID
          ---
          - tapOn: "Text 100%"
          - extendedWaitUntil:
              visible: "Text 110%"
              timeout: 10000
          - tapOn: "Text 110%"
          - extendedWaitUntil:
              visible: "Text 120%"
              timeout: 10000
          YAML

          boot_and_install() {
            local udid="$1"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl ui "$udid" appearance light
            xcrun simctl install "$udid" "$IOS_APP"
          }

          run_flow() {
            local udid="$1"
            local flow="$2"
            maestro --device "$udid" test "$flow"
          }

          reset_to_home() {
            local udid="$1"
            xcrun simctl terminate "$udid" "$APP_ID" 2>/dev/null || true
            run_flow "$udid" "$FLOW_ROOT/home.yaml"
          }

          assert_native_health() {
            local udid="$1"
            local outdir="$2"
            xcrun simctl spawn "$udid" log show --style compact --last 10m --predicate 'process == "HealthTimesStaging" AND (eventMessage CONTAINS[c] "KeyChainException" OR eventMessage CONTAINS[c] "A required entitlement" OR eventMessage CONTAINS[c] "FunctionCallException")' > "$outdir/runtime.log" || true
            grep -Ev 'log run noninteractively|args:.*eventMessage|predicate' "$outdir/runtime.log" > "$outdir/runtime-errors.log" || true
            if grep -Eiq 'KeyChainException|A required entitlement|FunctionCallException' "$outdir/runtime-errors.log"; then
              cat "$outdir/runtime-errors.log"
              echo "::error::Native staging Reader hit a SecureStore/Keychain runtime failure."
              exit 1
            fi
          }

          capture_device() {
            local udid="$1"
            local name="$2"
            local kind="$3"
            local outdir="$ROOT/$kind"
            boot_and_install "$udid"
            codesign -d --entitlements :- "$IOS_APP" > "$outdir/app-entitlements.plist" 2>&1 || true

            reset_to_home "$udid"
            xcrun simctl io "$udid" screenshot "$outdir/home.png"

            reset_to_home "$udid"
            run_flow "$udid" "$FLOW_ROOT/premium.yaml"
            xcrun simctl io "$udid" screenshot "$outdir/premium.png"

            reset_to_home "$udid"
            run_flow "$udid" "$FLOW_ROOT/watch.yaml"
            xcrun simctl io "$udid" screenshot "$outdir/watch.png"

            reset_to_home "$udid"
            run_flow "$udid" "$FLOW_ROOT/article.yaml"
            xcrun simctl io "$udid" screenshot "$outdir/article-resolved.png"

            if [[ "$kind" == "iphone" ]]; then
              run_flow "$udid" "$FLOW_ROOT/text-scale.yaml"
              xcrun simctl io "$udid" screenshot "$outdir/article-text-120.png"

              xcrun simctl uninstall "$udid" "$APP_ID"
              xcrun simctl ui "$udid" appearance dark
              xcrun simctl install "$udid" "$IOS_APP"
              run_flow "$udid" "$FLOW_ROOT/home.yaml"
              xcrun simctl io "$udid" screenshot "$outdir/home-dark.png"
              printf 'system appearance forced to dark before clean reinstall and launch\n' > "$outdir/dark-mode-proof.txt"
            fi

            assert_native_health "$udid" "$outdir"
            DEVICE_NAME="$name" DEVICE_UDID="$udid" DEVICE_KIND="$kind" EVIDENCE_SHA="$EXPECTED_SHA" ARTICLE_ID="$ARTICLE_ID" python3 - <<'PY' > "$outdir/manifest.json"
          import json, os
          kind=os.environ["DEVICE_KIND"]
          screens=[
            {"route":"/","state":"resolved-home","file":"home.png"},
            {"route":"/premium","state":"actual-route","file":"premium.png"},
            {"route":"/watch","state":"actual-route","file":"watch.png"},
            {"route":"/article/"+os.environ["ARTICLE_ID"],"state":"resolved-article","file":"article-resolved.png"}
          ]
          if kind=="iphone":
            screens += [
              {"route":"/article/"+os.environ["ARTICLE_ID"],"state":"article-text-120-percent","file":"article-text-120.png"},
              {"route":"/","state":"system-dark-rendered","file":"home-dark.png"}
            ]
          print(json.dumps({
            "sha":os.environ["EVIDENCE_SHA"],
            "deviceClass":kind,
            "deviceName":os.environ["DEVICE_NAME"],
            "udid":os.environ["DEVICE_UDID"],
            "articleId":os.environ["ARTICLE_ID"],
            "navigation":{"premium":"deep link accepted through simulator UI automation","watch":"deep link accepted through simulator UI automation","article":"deep link accepted through simulator UI automation"},
            "screens":screens
          },indent=2))
          PY
            xcrun simctl shutdown "$udid" || true
          }

          capture_device "$PHONE_UDID" "$PHONE_NAME" iphone
          capture_device "$IPAD_UDID" "$IPAD_NAME" ipad

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-candidate-ios-iphone-evidence
          path: phase10-evidence/after/ios/iphone/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-candidate-ipad-evidence
          path: phase10-evidence/after/ios/ipad/
          if-no-files-found: error
          retention-days: 30

  candidate-android:
    name: Candidate Android tablet emulator screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --prefix apps/mobile --no-audit --no-fund
      - name: Generate staging Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build staging release APK
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\n' >> gradle.properties
          ./gradlew assembleRelease --no-daemon --max-workers=2
      - name: Boot genuine tablet AVD and capture Reader
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/phase10-tablet-avd"
          APP_ID="zw.co.healthtimes.app.staging"
          resolve_article_id() {
            node <<'NODE'
          const base=process.env.EXPO_PUBLIC_SUPABASE_URL;
          const key=process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY;
          if(!base || !key) throw new Error("Staging Supabase configuration is required for native Article evidence.");
          const headers={apikey:key,Authorization:`Bearer ${key}`,"Content-Type":"application/json"};
          async function rpc(name,body){
            let last="";
            for(let attempt=1;attempt<=5;attempt++){
              const response=await fetch(`${base}/rest/v1/rpc/${name}`,{
                method:"POST",
                headers,
                body:JSON.stringify(body)
              });
              if(response.ok) return response.json();
              last=`HTTP ${response.status}: ${await response.text()}`;
              await new Promise((resolve)=>setTimeout(resolve,attempt*1000));
            }
            throw new Error(name+" failed after bounded retries: "+last);
          }
          (async()=>{
            const feed=await rpc("ag05_public_feed_rows",{p_limit:12});
            for(const row of feed ?? []){
              if(!row?.canonical_url) continue;
              let pathname;
              try{ pathname=new URL(row.canonical_url).pathname; }catch{ continue; }
              if(!pathname.endsWith("/")) pathname+="/";
              const document=await rpc("ag05_public_story_document",{p_path:pathname});
              if(document?.story_id){
                process.stdout.write(String(document.story_id));
                return;
              }
            }
            throw new Error("No current staging feed story resolved to an Article document.");
          })().catch((error)=>{
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
          }
          ARTICLE_ID="$(resolve_article_id)"
          test -n "$ARTICLE_ID"
          echo "EVIDENCE_ARTICLE_ID=$ARTICLE_ID"
          OUT="$PWD/phase10-evidence/after/android-tablet"
          mkdir -p "$ANDROID_AVD_HOME" "$OUT"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          SYSTEM_IMAGE="system-images;android-35;default;x86_64"
          "$SDKMANAGER" "platform-tools" "emulator" "$SYSTEM_IMAGE"

          DEVICE_LIST="$("$AVDMANAGER" list device)"
          printf '%s\n' "$DEVICE_LIST" > "$OUT/avd-device-catalog.txt"
          if grep -q 'or "Nexus 10"' "$OUT/avd-device-catalog.txt"; then
            TABLET_PROFILE="Nexus 10"
          elif grep -q 'or "pixel_c"' "$OUT/avd-device-catalog.txt"; then
            TABLET_PROFILE="pixel_c"
          else
            echo "::error::No known tablet-class Android device profile is available."
            cat "$OUT/avd-device-catalog.txt"
            exit 1
          fi
          echo "TABLET_PROFILE=$TABLET_PROFILE"
          echo no | "$AVDMANAGER" create avd -n phase10tablet -k "$SYSTEM_IMAGE" --device "$TABLET_PROFILE" --force
          cp "$ANDROID_AVD_HOME/phase10tablet.avd/config.ini" "$OUT/avd-config.ini"
          grep -E '^(hw.device.name|hw.lcd.width|hw.lcd.height|hw.lcd.density|image.sysdir.1)' "$OUT/avd-config.ini" > "$OUT/tablet-profile-proof.txt" || true
          if ! grep -Eq '^hw.device.name *= *(pixel_c|Nexus 10)' "$OUT/avd-config.ini"; then
            echo "::error::Created AVD is not using the selected tablet device profile."
            cat "$OUT/avd-config.ini"
            exit 1
          fi

          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm || true; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd phase10tablet -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics >/tmp/phase10-tablet-emulator.log 2>&1 &
          emulator_pid=$!
          device_ready=0
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android tablet emulator exited before adb registered a device"
              cat /tmp/phase10-tablet-emulator.log
              exit 1
            fi
            if adb devices | awk 'NR>1 && $2=="device" {found=1} END {exit found?0:1}'; then
              device_ready=1
              break
            fi
            sleep 2
          done
          test "$device_ready" = "1"
          boot_ready=0
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              boot_ready=1
              break
            fi
            sleep 2
          done
          test "$boot_ready" = "1"
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell wm dismiss-keyguard || true
          adb shell input keyevent 82 || true
          adb shell wm size > "$OUT/wm-size.txt"
          adb shell wm density > "$OUT/wm-density.txt"
          adb shell getprop ro.product.model > "$OUT/product-model.txt"

          adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk

          # The tablet evidence must exercise the app, not depend on Pixel Launcher health.
          # CI headless tablet AVDs can surface a launcher ANR even when the target app is healthy.
          adb shell wm dismiss-keyguard || true
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell am force-stop com.google.android.apps.nexuslauncher || true
          adb shell am force-stop com.android.launcher3 || true
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
          LAUNCH_COMPONENT="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$APP_ID" 2>/dev/null | tr -d '\r' | tail -n 1)"
          if [[ -z "$LAUNCH_COMPONENT" || "$LAUNCH_COMPONENT" == *"No activity found"* ]]; then
            echo "::error::Could not resolve the HealthTimes staging launcher activity."
            adb shell dumpsys package "$APP_ID" | head -n 200 || true
            exit 1
          fi
          printf '%s\n' "$LAUNCH_COMPONENT" > "$OUT/app-launch-component.txt"
          echo "APP_LAUNCH_COMPONENT=$LAUNCH_COMPONENT"

          launch_healthtimes() {
            adb shell am force-stop "$APP_ID" || true
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell am force-stop com.android.launcher3 || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1 || true
            adb shell am start -W -n "$LAUNCH_COMPONENT"
          }

          dump_ui() {
            adb shell uiautomator dump /sdcard/phase10-ui.xml >/dev/null
            adb pull /sdcard/phase10-ui.xml "$OUT/current-ui.xml" >/dev/null
          }

          fail_on_app_error() {
            if grep -Eiq 'Pixel Launcher isn.t responding|Launcher isn.t responding' "$OUT/current-ui.xml"; then
              adb shell am force-stop com.google.android.apps.nexuslauncher || true
              adb shell am force-stop com.android.launcher3 || true
              adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1 || true
              launch_healthtimes
              return 0
            fi
            if grep -Eiq 'HealthTimes staging Supabase configuration is missing|FunctionCallException|Unhandled|Article not found\.|Error:' "$OUT/current-ui.xml"; then
              cat "$OUT/current-ui.xml"
              echo "::error::Android tablet Reader rendered an application error instead of Home."
              exit 1
            fi
          }

          wait_for_text() {
            local needle="$1"
            local label="$2"
            for attempt in $(seq 1 60); do
              dump_ui
              fail_on_app_error
              if grep -Fq "$needle" "$OUT/current-ui.xml"; then
                cp "$OUT/current-ui.xml" "$OUT/$label-ui.xml"
                return 0
              fi
              sleep 2
            done
            cat "$OUT/current-ui.xml"
            echo "::error::Timed out waiting for Android tablet state: $needle"
            exit 1
          }

          launch_healthtimes
          wait_for_text 'text="For You"' home
          if grep -q 'Loading Home' "$OUT/home-ui.xml"; then
            echo "::error::Android tablet Home remained in Loading Home."
            exit 1
          fi
          adb exec-out screencap -p > "$OUT/home.png"

          adb shell am start -W -a android.intent.action.VIEW -d "healthtimes://premium" "$APP_ID"
          wait_for_text 'text="Go Premium"' premium
          adb exec-out screencap -p > "$OUT/premium.png"

          adb shell am start -W -a android.intent.action.VIEW -d "healthtimes://watch" "$APP_ID"
          wait_for_text 'Watch HealthTimes interviews' watch
          adb exec-out screencap -p > "$OUT/watch.png"

          adb shell am start -W -a android.intent.action.VIEW -d "healthtimes://article/$ARTICLE_ID" "$APP_ID"
          wait_for_text 'text="Text 100%"' article
          if grep -q 'Loading article' "$OUT/article-ui.xml"; then
            echo "::error::Android tablet Article evidence was captured before resolution."
            exit 1
          fi
          adb exec-out screencap -p > "$OUT/article-resolved.png"

          EVIDENCE_SHA="$EXPECTED_SHA" TABLET_PROFILE="$TABLET_PROFILE" ARTICLE_ID="$ARTICLE_ID" python3 - <<'PY' > "$OUT/manifest.json"
          import json, os
          print(json.dumps({
            "sha":os.environ["EVIDENCE_SHA"],
            "deviceClass":"android-tablet",
            "avdName":"phase10tablet",
            "tabletProfile":os.environ["TABLET_PROFILE"],
            "articleId":os.environ["ARTICLE_ID"],
            "screens":[
              {"route":"/","state":"resolved-home","file":"home.png"},
              {"route":"/premium","state":"actual-route","file":"premium.png"},
              {"route":"/watch","state":"actual-route","file":"watch.png"},
              {"route":"/article/"+os.environ["ARTICLE_ID"],"state":"resolved-article","file":"article-resolved.png"}
            ]
          },indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-candidate-android-tablet-evidence
          path: |
            phase10-evidence/after/android-tablet/
            /tmp/phase10-tablet-emulator.log
          if-no-files-found: error
          retention-days: 30
