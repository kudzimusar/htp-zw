name: Deploy HealthTimes Universal PWA Preview

on:
  push:
    branches:
      - feat/native-mobile-nm07-native-certification
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
      - 'docs/native-mobile/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: healthtimes-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install universal app dependencies
        run: npm install --prefix apps/mobile --no-audit --no-fund

      - name: Validate universal app
        run: npm run native:check

      - name: Export HealthTimes PWA for GitHub Pages
        env:
          APP_ENV: development
          HEALTHTIMES_WEB_BASE_URL: /htp-zw
        run: npm run native:export:web

      - name: Verify preview output
        shell: bash
        run: |
          test -f apps/mobile/dist/index.html
          test -f apps/mobile/dist/manifest.json
          test -f apps/mobile/dist/sw.js
          test -f apps/mobile/dist/healthtimes-icon.svg
          touch apps/mobile/dist/.nojekyll
          echo "HealthTimes universal PWA preview ready."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload universal PWA artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/mobile/dist

  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy universal PWA preview
        id: deployment
        uses: actions/deploy-pages@v4
