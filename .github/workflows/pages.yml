name: Deploy HealthTimes Universal PWA Preview

on:
  push:
    branches:
      - feat/native-mobile-nm07-native-certification
      - feat/native-mobile-nm04-reader-media-offline
      - 'feat/native-mobile-nm05-*'
      - integration/native-mobile-nm00-convergence
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
      - 'docs/native-mobile/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: healthtimes-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install universal app dependencies
        run: npm install --prefix apps/mobile --no-audit --no-fund

      - name: Validate universal app
        run: npm run native:check

      - name: Validate read-only source parity bridge
        run: npm --prefix apps/mobile run test:source-parity

      - name: Validate Reader product and Home hydration guard contract
        run: npm --prefix apps/mobile run test:reader-product

      - name: Validate NM-04 article fidelity and bounded search ranking
        run: npm --prefix apps/mobile run test:reader-fidelity

      - name: Validate NM-04 bounded Search ranking
        run: npm --prefix apps/mobile run test:search-ranking

      - name: Validate NM-05 growth and commercial provider readiness
        run: npm --prefix apps/mobile run test:growth-commercial

      - name: Probe public WordPress source reachability and browser CORS
        shell: bash
        run: |
          set -u
          endpoint='https://healthtimes.co.zw/wp-json/wp/v2/posts?per_page=1&status=publish&orderby=date&order=desc&_embed=1'
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl -sS --connect-timeout 10 --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' \
            -H 'Origin: https://kudzimusar.github.io' \
            -H 'Accept: application/json' \
            "$endpoint" || true)"
          echo "HealthTimes public REST HTTP status: ${status:-curl-failed}"
          cors_origin="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); print}' "$headers" | tail -n 1)"
          echo "Access-Control-Allow-Origin: ${cors_origin:-<missing>}"

          if [[ "$status" == "200" && -s "$body" ]]; then
            node - "$body" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          if (!Array.isArray(payload)) throw new Error("Public WordPress posts response is not an array.");
          const post = payload[0] || {};
          console.log("Public REST payload: PASS");
          console.log("Latest public post slug:", post.slug || "<none>");
          console.log("Embedded author:", Boolean(post._embedded?.author?.length));
          console.log("Embedded media:", Boolean(post._embedded?.["wp:featuredmedia"]?.length));
          console.log("Embedded taxonomy:", Boolean(post._embedded?.["wp:term"]?.flat?.().length));
          NODE
          else
            echo "::warning::Public WordPress REST probe was unavailable; deterministic source-parity snapshot remains the intended fallback."
          fi

          if [[ "$cors_origin" == "*" || "$cors_origin" == "https://kudzimusar.github.io" ]]; then
            echo "GitHub Pages browser CORS compatibility: PASS"
          else
            echo "::warning::GitHub Pages live refresh is not CORS-confirmed from the public response. The PWA will continue using its deterministic fallback when browser fetch is blocked."
          fi

      - name: Export HealthTimes PWA for GitHub Pages
        env:
          APP_ENV: development
          EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: source-parity
          HEALTHTIMES_WEB_BASE_URL: /htp-zw
        run: npm run native:export:web

      - name: Install Chromium hydration test harness
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium

      - name: Exercise Home loading-to-loaded hydration in Chromium
        run: node apps/mobile/tests/pwa-home-hydration.spec.js

      - name: Verify preview output
        shell: bash
        run: |
          test -f apps/mobile/dist/index.html
          test -f apps/mobile/dist/manifest.json
          test -f apps/mobile/dist/sw.js
          test -f apps/mobile/dist/healthtimes-icon.svg
          test -f apps/mobile/dist/ads.txt
          test -f apps/mobile/dist/app-ads.txt
          grep -Fxq 'google.com, pub-8744434739998394, DIRECT, f08c47fec0942fa0' apps/mobile/dist/ads.txt
          test ! -s apps/mobile/dist/app-ads.txt
          ! grep -Riq 'ca-app-pub-' apps/mobile/dist/ads.txt apps/mobile/dist/app-ads.txt
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("apps/mobile/dist/index.html", "utf8");
          for (const marker of ["/htp-zw/manifest.json", "/htp-zw/healthtimes-icon.svg", "/htp-zw/sw.js"]) {
            if (!html.includes(marker)) throw new Error("Missing base-aware PWA marker: " + marker);
          }
          const manifest = JSON.parse(fs.readFileSync("apps/mobile/dist/manifest.json", "utf8"));
          if (manifest.start_url !== "./" || manifest.scope !== "./" || manifest.id !== "./") {
            throw new Error("PWA manifest is not subpath-safe.");
          }
          const sw = fs.readFileSync("apps/mobile/dist/sw.js", "utf8");
          if (!sw.includes("self.registration.scope")) throw new Error("Service worker does not derive its Pages scope.");
          NODE
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const dist = "apps/mobile/dist";
          const required = ["explore","live","search","premium","watch","my"];
          const routeExists = (route) => [
            path.join(dist, route + ".html"),
            path.join(dist, route, "index.html")
          ].some(fs.existsSync);
          for (const route of required) {
            if (!routeExists(route)) throw new Error("Missing statically exported route: /" + route);
          }
          const articleDir = path.join(dist, "article");
          const articleExported =
            fs.existsSync(articleDir) &&
            fs.readdirSync(articleDir).some((name) => name.endsWith(".html") || fs.existsSync(path.join(articleDir, name, "index.html")));
          if (!articleExported) throw new Error("No statically exported Article Reader route found.");
          NODE
          node <<'NODE'
          const fs=require("fs");
          const marker="HEALTHTIMES_PWA_DEEP_LINK_FALLBACK";
          const base="/htp-zw";
          const storageKey="ht:nm04:pwa-deep-link";
          const script=`(function(){try{var base=${JSON.stringify(base)};var key=${JSON.stringify(storageKey)};var route=location.pathname+location.search+location.hash;if(!(route===base||route.indexOf(base+"/")===0))route=base+"/";sessionStorage.setItem(key,route);location.replace(base+"/?__ht_pwa_deep_link=1");}catch(_){location.replace(base+"/");}})();`;
          fs.writeFileSync("apps/mobile/dist/404.html","<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>HealthTimes</title></head><body><!-- "+marker+" --><script>"+script+"</script></body></html>");
          const rootHtml=fs.readFileSync("apps/mobile/dist/index.html","utf8");
          if(!rootHtml.includes(storageKey)) throw new Error("PWA root is missing the deep-link restore handshake.");
          const fallback=fs.readFileSync("apps/mobile/dist/404.html","utf8");
          if(!fallback.includes(marker)||!fallback.includes(storageKey)||!fallback.includes(base)) throw new Error("PWA deep-link fallback is incomplete.");
          NODE
          printf '{"sha":"%s","service_mode":"source-parity","base_path":"/htp-zw"}\n' "$GITHUB_SHA" > apps/mobile/dist/build-info.json
          touch apps/mobile/dist/.nojekyll
          echo "HealthTimes source-parity PWA preview ready at /htp-zw/."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload universal PWA artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/mobile/dist

  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy universal PWA preview
        id: deployment
        uses: actions/deploy-pages@v4

  verify-deployment:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify exact-head Pages deployment and critical routes
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          expected_sha="$GITHUB_SHA"

          for attempt in 1 2 3 4 5; do
            deployed_sha="$(curl -fsSL --max-time 20 "$base/build-info.json" 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{process.stdout.write(JSON.parse(d).sha||"")}catch{}})')"
            if [[ "$deployed_sha" == "$expected_sha" ]]; then
              echo "Exact-head Pages deployment: PASS ($deployed_sha)"
              break
            fi
            if [[ "$attempt" == "5" ]]; then
              echo "::error::Pages deployment SHA mismatch. Expected $expected_sha, received ${deployed_sha:-<none>}."
              exit 1
            fi
            sleep 5
          done

          routes=(
            ""
            "live"
            "explore"
            "search"
            "premium"
            "watch"
            "my"
            "article/source-zimbabwe-strengthens-social-contracting-as-hiv-donor-funding-shrinks"
          )
          for route in "${routes[@]}"; do
            url="$base/${route}"
            curl -fsSL --max-time 20 "$url" >/dev/null
            echo "Route PASS: /${route}"
          done

          curl -fsSL --max-time 20 "$base/manifest.json" >/dev/null
          curl -fsSL --max-time 20 "$base/sw.js" >/dev/null
          curl -fsSL --max-time 20 "$base/healthtimes-icon.svg" >/dev/null
          echo "Manifest, service worker and icon: PASS"

          synthetic_route="article/source-nm04-live-discovered-${expected_sha:0:12}"
          fallback_body="$(mktemp)"
          fallback_status="$(curl -sS --max-time 20 -o "$fallback_body" -w '%{http_code}' "$base/$synthetic_route")"
          if [[ "$fallback_status" != "404" ]]; then
            echo "::error::Expected GitHub Pages to enter the custom fallback for a non-exported article route; status was $fallback_status."
            exit 1
          fi
          grep -q 'HEALTHTIMES_PWA_DEEP_LINK_FALLBACK' "$fallback_body"
          grep -q 'ht:nm04:pwa-deep-link' "$fallback_body"
          echo "Fresh non-exported Article deep-link fallback: PASS (/$synthetic_route)"
