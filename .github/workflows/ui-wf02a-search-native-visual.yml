name: UI-WF-02A Search Native Visual Evidence

on:
  pull_request:
    branches:
      - feat/ui-wf01a-compact-reader-shell
  push:
    branches:
      - feat/ui-wf02a-search-wireframe-convergence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-wf02a-search-native-visual-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: development
  EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: source-parity
  EXPECTED_PACKAGE: zw.co.healthtimes.app.dev
  EXPECTED_DISPLAY_NAME: HealthTimes Dev
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  ios-search-native:
    name: iOS phone Search-direct native evidence
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Prove exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"

      - name: Record native Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install canonical apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix apps/mobile --no-audit --no-fund

      - name: Generate iOS native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Resolve Xcode workspace and scheme
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          WORKSPACE_NAME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -list -json -workspace "$WORKSPACE" > xcode-list.json
          SCHEME=$(WORKSPACE_NAME="$WORKSPACE_NAME" python3 - <<'PY'
          import json, os
          data=json.load(open('xcode-list.json'))
          schemes=data.get('workspace',{}).get('schemes',[])
          preferred=os.environ['WORKSPACE_NAME']
          if preferred in schemes:
              print(preferred)
          else:
              app=[s for s in schemes if not s.startswith(('EX','Pods-','React','ExpoModules','RN'))]
              if not app:
                  raise SystemExit('No application scheme found: '+','.join(schemes))
              print(app[0])
          PY
          )
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Resolve current supported iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re, subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates=[]
          for runtime,devices in data.get("devices",{}).items():
              version=tuple(int(x) for x in re.findall(r"\d+",runtime))
              for device in devices:
                  name=device.get("name","")
                  udid=device.get("udid","")
                  if name.startswith("iPhone") and udid:
                      candidates.append((version,name,udid,runtime))
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          version,name,udid,runtime=sorted(candidates)[-1]
          print("SIM_UDID="+udid)
          print("SIM_NAME="+name)
          print("SIM_RUNTIME="+runtime.rsplit(".",1)[-1].replace("-",".").replace("iOS.","iOS "))
          PY

      - name: Reset and boot selected iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true
          xcrun simctl erase "$SIM_UDID"
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl ui "$SIM_UDID" appearance light || true

      - name: Build Debug iOS Simulator app
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP=$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 2 -type d -name '*.app' -print -quit)
          test -n "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE_ID" = "zw.co.healthtimes.app.dev"
          echo "IOS_APP=$PWD/$APP" >> "$GITHUB_ENV"

      - name: Install Maestro
        shell: bash
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Certify Search directly on iOS Simulator (fail-closed)
        shell: bash
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          set -euo pipefail
          EVIDENCE_DIR="ui-wf02a-search-native-evidence/ios"
          mkdir -p "$EVIDENCE_DIR"

          (
            cd apps/mobile
            CI=1 EXPO_UNSTABLE_HEADLESS=1 EXPO_NO_DEV_MENU=1 npx expo start --localhost > "../../$EVIDENCE_DIR/metro.log" 2>&1
          ) &
          METRO_PID=$!
          trap 'kill "$METRO_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 120); do
            if ! kill -0 "$METRO_PID" 2>/dev/null; then
              echo "Metro exited before iOS Search evidence could start"
              cat "$EVIDENCE_DIR/metro.log"
              exit 1
            fi
            if curl --connect-timeout 1 --max-time 2 -sS -o /dev/null http://localhost:8081/; then
              break
            fi
            if [[ "$i" == "120" ]]; then
              echo "Metro did not accept HTTP connections"
              cat "$EVIDENCE_DIR/metro.log"
              exit 1
            fi
            sleep 2
          done

          IOS_METRO_BUNDLE_URL='http://localhost:8081/.expo/.virtual-metro-entry.bundle?platform=ios&dev=true&lazy=true&minify=false&inlineSourceMap=false&modulesOnly=false&runModule=true&excludeSource=true&sourcePaths=url-server&app=zw.co.healthtimes.app.dev'
          curl --fail --location --max-time 360 --silent --show-error --output /dev/null "$IOS_METRO_BUNDLE_URL"

          xcrun simctl install "$SIM_UDID" "$IOS_APP"
          xcrun simctl launch "$SIM_UDID" zw.co.healthtimes.app.dev
          sleep 4
          xcrun simctl openurl "$SIM_UDID" "healthtimes://search" || true

          maestro --device "$SIM_UDID" test \
            --test-output-dir "$EVIDENCE_DIR/maestro" \
            apps/mobile/e2e/ui-wf02a-search-native.yaml

          INITIAL_SHOT="$(find "$EVIDENCE_DIR/maestro" -type f -name 'search-initial.png' -print -quit)"
          FILTERS_SHOT="$(find "$EVIDENCE_DIR/maestro" -type f -name 'search-filters-open.png' -print -quit)"
          test -f "$INITIAL_SHOT"
          test -f "$FILTERS_SHOT"
          cp "$INITIAL_SHOT" "$EVIDENCE_DIR/ios-search-initial.png"
          cp "$FILTERS_SHOT" "$EVIDENCE_DIR/ios-search-filters-open.png"

          xcrun simctl spawn "$SIM_UDID" launchctl list | grep -F "zw.co.healthtimes.app.dev" > "$EVIDENCE_DIR/foreground-process.txt"

          : > "$EVIDENCE_DIR/native-errors.log"
          grep -E '^ ERROR  ' "$EVIDENCE_DIR/metro.log" >> "$EVIDENCE_DIR/native-errors.log" || true
          xcrun simctl spawn "$SIM_UDID" log show --last 20m --style compact \
            --predicate 'process CONTAINS[c] "HealthTimes"' 2>/dev/null \
            | grep -E '\[com\.facebook\.react\.log:javascript\].*(ERROR|Error|Fatal|Exception)|Unhandled JS Exception|RCTFatal|Terminating app' \
            >> "$EVIDENCE_DIR/native-errors.log" || true

          if [[ -s "$EVIDENCE_DIR/native-errors.log" ]]; then
            echo "Native iOS runtime error detected:"
            cat "$EVIDENCE_DIR/native-errors.log"
            exit 1
          fi

          python3 - <<'PY'
          import hashlib, json, os, pathlib
          ev = pathlib.Path("ui-wf02a-search-native-evidence/ios")
          shots = {}
          for name in ["ios-search-initial.png", "ios-search-filters-open.png"]:
              p = ev / name
              raw = p.read_bytes()
              assert len(raw) > 1000 and raw[:8] == b"\x89PNG\r\n\x1a\n", f"Invalid PNG: {name}"
              shots[name] = {"sha256": hashlib.sha256(raw).hexdigest(), "bytes": len(raw)}
          manifest = {
              "task": "UI-WF-02A-R3-T2-R2",
              "platform": "iOS",
              "device": f"{os.environ['SIM_NAME']} ({os.environ['SIM_UDID']})",
              "runtime": os.environ["SIM_RUNTIME"],
              "bundleId": "zw.co.healthtimes.app.dev",
              "candidateSha": os.environ["EXPECTED_SHA"],
              "foregroundProcessProof": (ev / "foreground-process.txt").read_text().strip(),
              "runtimeErrorCount": 0,
              "visibleControlsVerified": [
                  "Search HealthTimes",
                  "All",
                  "Articles",
                  "Videos",
                  "Audio",
                  "Authors",
                  "Filters",
                  "COUNTRY",
                  "TOPIC / DESK",
                  "Try searching for",
                  "Intelligent Search",
                  "Home",
                  "Explore",
                  "Live",
                  "Watch",
                  "My HT"
              ],
              "sixthSearchTabPresent": False,
              "screenshots": shots
          }
          (ev / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload iOS Search native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-wf02a-search-native-ios-attempt-${{ github.run_attempt }}
          path: ui-wf02a-search-native-evidence/ios/
          if-no-files-found: error
          retention-days: 30

  android-search-native:
    name: Android phone Search-direct native evidence
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Prove exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install canonical apps/mobile and record dependency tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-wf02a-search-native-evidence/android
          npm install --prefix apps/mobile --no-audit --no-fund
          {
            npm --prefix apps/mobile ls \
              expo \
              expo-modules-autolinking \
              expo-modules-core \
              expo-router \
              react-native \
              --all || true
          } | tee ui-wf02a-search-native-evidence/android/dependency-tree.txt

      - name: Diagnose and repair missing Android autolinking Publication.version metadata (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-wf02a-search-native-evidence/android
          (
            cd apps/mobile
            npx expo-modules-autolinking resolve -p android --json > /tmp/ui-wf02a-android-autolinking-before.json
          )
          cp /tmp/ui-wf02a-android-autolinking-before.json ui-wf02a-search-native-evidence/android/autolinking-before.json

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const repoRoot = process.cwd();
          const nodeModulesRoot = path.resolve(repoRoot, 'apps/mobile/node_modules');
          const beforePath = '/tmp/ui-wf02a-android-autolinking-before.json';
          const beforeData = JSON.parse(fs.readFileSync(beforePath, 'utf8'));
          const modules = Array.isArray(beforeData.modules) ? beforeData.modules : [];
          const semverRe = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;

          function findModuleRoot(sourceDir, expectedPackageName) {
            let current = path.resolve(sourceDir);
            while (current.startsWith(nodeModulesRoot) && current !== nodeModulesRoot) {
              const pkgPath = path.join(current, 'package.json');
              if (fs.existsSync(pkgPath)) {
                try {
                  const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                  if (pkg.name === expectedPackageName) {
                    return current;
                  }
                } catch {}
              }
              const parent = path.dirname(current);
              if (parent === current) break;
              current = parent;
            }
            const directCandidate = path.join(nodeModulesRoot, expectedPackageName);
            if (fs.existsSync(path.join(directCandidate, 'package.json'))) {
              return directCandidate;
            }
            return null;
          }

          // Phase 1: Diagnose before any repair
          const diagnosed = [];
          for (let i = 0; i < modules.length; i++) {
            const mod = modules[i];
            const projects = Array.isArray(mod.projects) ? mod.projects : [];
            for (let j = 0; j < projects.length; j++) {
              const proj = projects[j];
              const pub = proj.publication;
              if (pub == null) continue;
              const hasValidVersion = typeof pub.version === 'string' && pub.version.trim().length > 0;
              if (hasValidVersion) continue;

              const modRoot = findModuleRoot(proj.sourceDir || '', mod.packageName);
              if (!modRoot || !modRoot.startsWith(nodeModulesRoot + path.sep)) {
                throw new Error(
                  `Cannot resolve module identity inside node_modules for ${mod.packageName} (sourceDir=${proj.sourceDir})`
                );
              }
              const pkgJsonPath = path.join(modRoot, 'package.json');
              const configPath = path.join(modRoot, 'expo-module.config.json');
              if (!fs.existsSync(pkgJsonPath)) {
                throw new Error(`Missing package.json at ${pkgJsonPath}`);
              }
              if (!fs.existsSync(configPath)) {
                throw new Error(`Missing expo-module.config.json at ${configPath}`);
              }
              const pkgJson = JSON.parse(fs.readFileSync(pkgJsonPath, 'utf8'));
              const pkgVersion = pkgJson.version;
              if (typeof pkgVersion !== 'string' || !semverRe.test(pkgVersion.trim())) {
                throw new Error(
                  `Absent or malformed package.json.version ('${pkgVersion}') in ${pkgJsonPath}`
                );
              }

              diagnosed.push({
                moduleIndex: i,
                projectIndex: j,
                packageName: mod.packageName,
                resolvedModulePath: path.relative(repoRoot, modRoot),
                expoModuleConfigPath: path.relative(repoRoot, configPath),
                packageJsonPath: path.relative(repoRoot, pkgJsonPath),
                absConfigPath: configPath,
                packageVersion: pkgVersion.trim(),
                currentPublication: pub
              });
            }
          }

          console.log('=== SECTION 5: ANDROID AUTOLINKING DIAGNOSTIC BEFORE REPAIR ===');
          console.log(JSON.stringify(diagnosed, null, 2));
          fs.writeFileSync(
            'ui-wf02a-search-native-evidence/android/autolinking-diagnostic.json',
            JSON.stringify({ missingPublicationVersionCount: diagnosed.length, diagnosed }, null, 2) + '\n'
          );

          // Phase 2: Temporary node_modules repair ONLY for diagnosed entries
          const receipts = [];
          const textLines = [];
          const alteredConfigs = new Set();

          for (const d of diagnosed) {
            const pub = d.currentPublication;
            if (
              typeof pub !== 'object' ||
              typeof pub.groupId !== 'string' || !pub.groupId.trim() ||
              typeof pub.artifactId !== 'string' || !pub.artifactId.trim() ||
              typeof pub.repository !== 'string' || !pub.repository.trim()
            ) {
              throw new Error(
                `Ambiguous publication object for ${d.packageName}: ${JSON.stringify(pub)}`
              );
            }

            const allowedKeys = new Set(['groupId', 'artifactId', 'version', 'repository']);
            for (const k of Object.keys(pub)) {
              if (!allowedKeys.has(k)) {
                throw new Error(`Unexpected key '${k}' in publication for ${d.packageName}`);
              }
            }

            const rawConfig = JSON.parse(fs.readFileSync(d.absConfigPath, 'utf8'));
            let targetPub = null;
            if (rawConfig.android && rawConfig.android.publication) {
              if (typeof rawConfig.android.publication.version === 'string' && rawConfig.android.publication.version.trim()) {
                throw new Error(`Refusing to overwrite existing valid version in ${d.expoModuleConfigPath}`);
              }
              targetPub = rawConfig.android.publication;
            } else if (rawConfig.android && Array.isArray(rawConfig.android.projects)) {
              const candidates = rawConfig.android.projects.filter(
                p => p.publication && (!p.publication.version || !String(p.publication.version).trim())
              );
              if (candidates.length !== 1) {
                throw new Error(`Ambiguous android.projects publication target in ${d.expoModuleConfigPath}`);
              }
              targetPub = candidates[0].publication;
            }

            if (!targetPub) {
              throw new Error(`Cannot locate publication object unambiguously in ${d.expoModuleConfigPath}`);
            }

            const beforeJson = JSON.parse(JSON.stringify(targetPub));
            targetPub.version = d.packageVersion;
            const afterJson = JSON.parse(JSON.stringify(targetPub));

            fs.writeFileSync(d.absConfigPath, JSON.stringify(rawConfig, null, 2) + '\n');
            alteredConfigs.add(d.expoModuleConfigPath);

            const receiptEntry = {
              moduleIndex: d.moduleIndex,
              projectIndex: d.projectIndex,
              packageName: d.packageName,
              resolvedModulePath: d.resolvedModulePath,
              expoModuleConfigPath: d.expoModuleConfigPath,
              packageJsonPath: d.packageJsonPath,
              beforePublication: beforeJson,
              derivedVersion: d.packageVersion,
              afterPublication: afterJson
            };
            receipts.push(receiptEntry);

            const block = [
              `moduleIndex=${d.moduleIndex}`,
              `projectIndex=${d.projectIndex}`,
              `package=${d.packageName}`,
              `resolvedModulePath=${d.resolvedModulePath}`,
              `packageJson=${d.packageJsonPath}`,
              `config=${d.expoModuleConfigPath}`,
              `BEFORE_JSON=${JSON.stringify(beforeJson)}`,
              `DERIVED_VERSION=${d.packageVersion}`,
              `AFTER_JSON=${JSON.stringify(afterJson)}`
            ].join('\n');
            textLines.push(block);
            console.log('=== SECTION 6/7: TEMPORARY NODE_MODULES REPAIR RECEIPT ===');
            console.log(block);
          }

          if (alteredConfigs.size > diagnosed.length) {
            throw new Error(`More modules altered (${alteredConfigs.size}) than diagnosed (${diagnosed.length})`);
          }

          fs.writeFileSync(
            'ui-wf02a-search-native-evidence/android/normalization-receipt.json',
            JSON.stringify({ normalizedCount: receipts.length, entries: receipts }, null, 2) + '\n'
          );
          fs.writeFileSync(
            'ui-wf02a-search-native-evidence/android/normalization-receipt.txt',
            (textLines.length ? textLines.join('\n---\n') : 'No modules required normalization.') + '\n'
          );
          NODE

          (
            cd apps/mobile
            npx expo-modules-autolinking resolve -p android --json > /tmp/ui-wf02a-android-autolinking-after.json
          )
          cp /tmp/ui-wf02a-android-autolinking-after.json ui-wf02a-search-native-evidence/android/autolinking-after.json

          node - <<'NODE'
          const fs = require('fs');
          const afterData = JSON.parse(fs.readFileSync('/tmp/ui-wf02a-android-autolinking-after.json', 'utf8'));
          const modules = Array.isArray(afterData.modules) ? afterData.modules : [];
          let checkedCount = 0;
          for (let i = 0; i < modules.length; i++) {
            const mod = modules[i];
            for (let j = 0; j < (mod.projects || []).length; j++) {
              const pub = mod.projects[j].publication;
              if (pub != null) {
                checkedCount++;
                if (typeof pub.version !== 'string' || !pub.version.trim()) {
                  throw new Error(
                    `Post-repair validation failed: missing publication.version at $.modules[${i}].projects[${j}].publication (${mod.packageName})`
                  );
                }
              }
            }
          }
          console.log(`=== SECTION 8: POST-REPAIR AUTOLINKING VALIDATION PASSED (${modules.length} modules, ${checkedCount} publications verified) ===`);
          NODE

      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Prove generated Android app is canonical React Native (no TWA/Capacitor/WebView wrapper)
        shell: bash
        run: |
          set -euo pipefail
          main_activity="$(find apps/mobile/android/app/src/main/java -type f -name 'MainActivity.kt' -print -quit)"
          main_application="$(find apps/mobile/android/app/src/main/java -type f -name 'MainApplication.kt' -print -quit)"
          test -n "$main_activity"
          test -n "$main_application"
          grep -Fq 'ReactActivity' "$main_activity"
          grep -Fq 'ReactApplication' "$main_application"
          if grep -RInE 'TrustedWebActivity|LauncherActivity|BridgeActivity|com\.getcapacitor|kudzimusar\.github\.io/htp-zw|android\.webkit\.WebView' apps/mobile/android/app/src/main; then
            echo "Forbidden wrapper detected in generated Android project"
            exit 1
          fi

      - name: Build self-contained release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prove APK package identity and wrapper absence
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          mkdir -p ui-wf02a-search-native-evidence/android
          "$AAPT" dump badging "$APK" > ui-wf02a-search-native-evidence/android/apk-badging.txt
          package_id="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" ui-wf02a-search-native-evidence/android/apk-badging.txt | head -1)"
          display_name="$(sed -n "s/^application-label:'\([^']*\)'.*/\1/p" ui-wf02a-search-native-evidence/android/apk-badging.txt | head -1)"
          test "$package_id" = "$EXPECTED_PACKAGE"
          test "$display_name" = "$EXPECTED_DISPLAY_NAME"

      - name: Install Maestro
        shell: bash
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Restore Android emulator cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-pixel_7_pro-v3

      - name: Certify Search directly on Android Emulator (fail-closed)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          enable-hw-keyboard: false
          disk-size: 6000M
          heap-size: 1024M
          script: |
            set -euo pipefail
            EVIDENCE_DIR="ui-wf02a-search-native-evidence/android"
            mkdir -p "$EVIDENCE_DIR"
            adb wait-for-device
            adb shell cmd uimode night no || true
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c || true

            adb shell am start -W -a android.intent.action.VIEW -d "healthtimes://search" zw.co.healthtimes.app.dev
            maestro --device emulator-5554 test \
              --test-output-dir "$EVIDENCE_DIR/maestro" \
              apps/mobile/e2e/ui-wf02a-search-native.yaml

            INITIAL_SHOT="$(find "$EVIDENCE_DIR/maestro" -type f -name 'search-initial.png' -print -quit)"
            FILTERS_SHOT="$(find "$EVIDENCE_DIR/maestro" -type f -name 'search-filters-open.png' -print -quit)"
            test -f "$INITIAL_SHOT"
            test -f "$FILTERS_SHOT"
            cp "$INITIAL_SHOT" "$EVIDENCE_DIR/android-search-initial.png"
            cp "$FILTERS_SHOT" "$EVIDENCE_DIR/android-search-filters-open.png"

            adb shell dumpsys activity activities > "$EVIDENCE_DIR/activity-state.txt"
            grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' "$EVIDENCE_DIR/activity-state.txt" > "$EVIDENCE_DIR/final-focus.txt" || true
            cat "$EVIDENCE_DIR/final-focus.txt"
            grep -Fq "zw.co.healthtimes.app.dev" "$EVIDENCE_DIR/final-focus.txt"
            if grep -Ei 'com\.android\.chrome|org\.chromium|customtab|TrustedWebActivity|com\.getcapacitor|WebView' "$EVIDENCE_DIR/final-focus.txt"; then
              echo "Forbidden browser/wrapper owns foreground focus"
              exit 1
            fi

            adb logcat -d '*:E' 2>/dev/null | grep -Ei 'ReactNativeJS.*(ERROR|Error|Exception)|FATAL EXCEPTION' > "$EVIDENCE_DIR/native-errors.log" || true
            if [[ -s "$EVIDENCE_DIR/native-errors.log" ]]; then
              echo "Fatal React Native / AndroidRuntime error detected:"
              cat "$EVIDENCE_DIR/native-errors.log"
              exit 1
            fi

            python3 - <<'PY'
            import hashlib, json, os, pathlib
            ev = pathlib.Path("ui-wf02a-search-native-evidence/android")
            shots = {}
            for name in ["android-search-initial.png", "android-search-filters-open.png"]:
                p = ev / name
                raw = p.read_bytes()
                assert len(raw) > 1000 and raw[:8] == b"\x89PNG\r\n\x1a\n", f"Invalid PNG: {name}"
                shots[name] = {"sha256": hashlib.sha256(raw).hexdigest(), "bytes": len(raw)}
            manifest = {
                "task": "UI-WF-02A-R3-T2-R2",
                "platform": "Android",
                "device": "pixel_7_pro (emulator-5554)",
                "runtime": "Android API 36 (google_apis/x86_64)",
                "packageId": "zw.co.healthtimes.app.dev",
                "candidateSha": os.environ["EXPECTED_SHA"],
                "foregroundActivityProof": (ev / "final-focus.txt").read_text().strip(),
                "runtimeErrorCount": 0,
                "visibleControlsVerified": [
                    "Search HealthTimes",
                    "All",
                    "Articles",
                    "Videos",
                    "Audio",
                    "Authors",
                    "Filters",
                    "COUNTRY",
                    "TOPIC / DESK",
                    "Try searching for",
                    "Intelligent Search",
                    "Home",
                    "Explore",
                    "Live",
                    "Watch",
                    "My HT"
                ],
                "sixthSearchTabPresent": False,
                "screenshots": shots
            }
            (ev / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
            PY

      - name: Upload Android Search native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-wf02a-search-native-android-attempt-${{ github.run_attempt }}
          path: ui-wf02a-search-native-evidence/android/
          if-no-files-found: error
          retention-days: 30
