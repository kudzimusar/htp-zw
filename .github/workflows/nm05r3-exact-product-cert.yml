name: NM-05R3 Exact Product Certification

on:
  push:
    branches:
      - test/nm05r3-exact-product-cert
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nm05r3-exact-product-cert
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODUCT_SHA: 5a92786ac5bda3e829bcd4d60bf101f3d66a5d28
    steps:
      - name: Check out certification tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out exact NM-05R3 product executable
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PRODUCT_SHA"
          actual="$(git rev-parse HEAD)"
          echo "PRODUCT_SHA=$PRODUCT_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$PRODUCT_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix apps/mobile --no-audit --no-fund

      - name: Run bounded product gates
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/mobile/tests/nm05-premium-consumer.test.mjs
          npm --prefix apps/mobile run test:source-parity
          npm --prefix apps/mobile run test:ui03
          npm --prefix apps/mobile run test:nm05-premium-consumer
          npm --prefix apps/mobile run test:nm05-premium-live
          npx playwright test tests/migration/ag05-premium-commerce-teaser.spec.js --reporter=line
          npm run native:export:web
