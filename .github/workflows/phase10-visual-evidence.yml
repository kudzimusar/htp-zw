name: Phase 10 Web/PWA Evidence

on:
  push:
    branches:
      - integration/ag07-nm07-phase10-visual-conformance
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-web-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: staging
  EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: source-parity
  HEALTHTIMES_WEB_BASE_URL: ""
  EXPO_PUBLIC_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
  HEALTHTIMES_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  HEALTHTIMES_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk

jobs:
  final-web:
    name: Final exact-head Web/PWA visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --prefix apps/mobile --no-audit --no-fund
      - run: npm run build:phase4:web
      - run: npx playwright install --with-deps chromium
      - name: Capture final mobile/tablet/desktop Reader evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/web/phase4-smoke-server.js >/tmp/phase10-final-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            if [[ "$attempt" == "10" ]]; then cat /tmp/phase10-final-web.log; exit 1; fi
            sleep 1
          done
          mkdir -p phase10-evidence/final/web
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs=require('fs');
          const path=require('path');
          const articleId='source-zimbabwe-strengthens-social-contracting-as-hiv-donor-funding-shrinks';
          const routes=[
            ['home','/'],['explore','/explore'],['search','/search'],['article','/article/'+articleId],
            ['live','/live'],['watch','/watch'],['my-ht','/my'],['premium','/premium'],
            ['saved','/saved'],['edition','/edition'],['notifications','/notifications'],
            ['listen','/listen'],['onboarding','/onboarding'],['studio','/studio']
          ];
          const viewports=[['mobile',390,844],['tablet',834,1112],['desktop',1440,1000]];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const manifest={sha:process.env.EXPECTED_SHA,capturedAt:new Date().toISOString(),screens:[]};
            for(const [viewport,width,height] of viewports){
              for(const [name,route] of routes){
                const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
                const pageErrors=[];
                page.on('pageerror',error=>pageErrors.push(String(error)));
                const response=await page.goto('http://127.0.0.1:4174'+route,{waitUntil:'domcontentloaded',timeout:30000});
                if(route==='/') await page.getByText('Top Stories',{exact:false}).first().waitFor({timeout:30000});
                else await page.waitForTimeout(1200);
                const hydrationRegenerationWarnings=pageErrors.filter(error=>error.includes('Minified React error #418'));
                if(hydrationRegenerationWarnings.length){
                  throw new Error(viewport+' '+name+' emitted React #418: '+hydrationRegenerationWarnings.join(' | '));
                }
                const otherErrors=pageErrors.filter(error=>!error.includes('Minified React error #418'));
                if(otherErrors.length) throw new Error(viewport+' '+name+' page errors: '+otherErrors.join(' | '));
                const file=path.join('phase10-evidence/final/web',viewport+'-'+name+'.png');
                await page.screenshot({path:file,fullPage:true});
                manifest.screens.push({
                  viewport,width,height,name,route,status:response?.status()??null,
                  title:await page.title(),file,hydrationRegenerationWarnings:0
                });
                await page.close();
              }
            }
            await browser.close();
            fs.writeFileSync('phase10-evidence/final/web/manifest.json',JSON.stringify(manifest,null,2));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase10-final-web-pwa-screenshots
          path: |
            phase10-evidence/final/web/
            /tmp/phase10-final-web.log
          if-no-files-found: error
          retention-days: 30
