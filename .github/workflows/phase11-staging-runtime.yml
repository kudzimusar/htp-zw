name: AG-07 Phase 11 Staging Runtime Candidate

on:
  push:
    branches:
      - deployment/ag07-phase11-authoritative-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ag07-phase11-staging-runtime
  cancel-in-progress: true

env:
  APP_ENV: staging
  EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
  HEALTHTIMES_WEB_BASE_URL: ""
  EXPO_PUBLIC_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
  HEALTHTIMES_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  HEALTHTIMES_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk

jobs:
  exact-head-web:
    name: Exact-head authoritative staging Web/PWA candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prove exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspaces
        run: |
          npm install --no-audit --no-fund
          npm install --prefix apps/mobile --no-audit --no-fund

      - name: Verify serving and product contracts
        run: |
          npm run test:phase4:web
          node --test apps/mobile/tests/phase10-visual-conformance.test.mjs
          node --test apps/mobile/tests/premium-hospaz-convergence.test.mjs
          npm run native:check

      - name: Re-prove CP5 read-only staging invariants
        run: npm run verify:ag05:readonly

      - name: Build the exact Vercel-authoritative staging mode
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: npm run build:phase4:web

      - name: Prove packaged runtime identity and service mode
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const info=JSON.parse(fs.readFileSync("apps/mobile/dist/build-info.json","utf8"));
          if(info.sha!==process.env.EXPECTED_SHA) throw new Error("build-info SHA mismatch: "+JSON.stringify(info));
          if(info.presentation!=="apps/mobile") throw new Error("presentation mismatch: "+JSON.stringify(info));
          if(info.serviceMode!=="staging") throw new Error("service mode mismatch: "+JSON.stringify(info));
          console.log(JSON.stringify(info,null,2));
          NODE

      - name: Prove raw HTTP routing, SEO and Premium fail-closed behavior
        run: npm run verify:phase4:http

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser proof using actual staging-mode bundle
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p phase11-evidence
          node scripts/web/phase4-smoke-server.js >/tmp/phase11-staging-runtime.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            if [[ "$attempt" == "15" ]]; then cat /tmp/phase11-staging-runtime.log; exit 1; fi
            sleep 1
          done
          node - <<'NODE'
          const { chromium } = require("@playwright/test");
          const fs=require("fs");
          const base="http://127.0.0.1:4174";
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const evidence={sha:process.env.EXPECTED_SHA,capturedAt:new Date().toISOString(),surfaces:[]};
            for(const viewport of [
              {name:"mobile",width:390,height:844},
              {name:"desktop",width:1440,height:1000}
            ]){
              const page=await browser.newPage({viewport:{width:viewport.width,height:viewport.height}});
              const pageErrors=[];
              const consoleErrors=[];
              page.on("pageerror",error=>pageErrors.push(String(error)));
              page.on("console",msg=>{if(msg.type()==="error") consoleErrors.push(msg.text());});

              const home=await page.goto(base+"/",{waitUntil:"domcontentloaded",timeout:30000});
              await page.getByText("ACCEPTED MIGRATED CORPUS",{exact:false}).first().waitFor({timeout:30000});
              await page.getByText("Top Stories",{exact:false}).first().waitFor({timeout:30000});
              const ad=page.locator('[aria-label="Advertising placement hospaz-header-direct"]');
              await ad.waitFor({timeout:30000});
              const adText=await ad.innerText();
              if(!adText.includes("HOSPAZ")) throw new Error(viewport.name+" HOSPAZ disclosure missing: "+adText);
              if(await ad.locator("a").count()) throw new Error(viewport.name+" HOSPAZ placement unexpectedly clickable");
              const tabs=await page.getByRole("tab").count();
              if(viewport.name==="mobile" && tabs<5) throw new Error("mobile five-tab navigation missing: "+tabs);
              if(viewport.name==="desktop" && tabs!==0) throw new Error("desktop retained mobile tabs: "+tabs);

              const explore=await page.goto(base+"/explore",{waitUntil:"domcontentloaded",timeout:30000});
              await page.getByText("Explore",{exact:true}).first().waitFor({timeout:30000});
              const exploreBody=await page.locator("body").innerText();
              for(const forbidden of ["TAXONOMY GATEWAY","Canonical desks","Legacy publication categories"]){
                if(exploreBody.includes(forbidden)) throw new Error("Explore restored internal terminology: "+forbidden);
              }

              const search=await page.goto(base+"/search",{waitUntil:"domcontentloaded",timeout:30000});
              const input=page.getByRole("textbox",{name:"Search HealthTimes"});
              await input.waitFor({timeout:30000});
              await input.fill("HIV");
              await input.press("Enter");
              await page.getByText("Article results",{exact:true}).first().waitFor({timeout:30000});
              await page.waitForTimeout(1200);

              const hydration=pageErrors.filter(error=>error.includes("Minified React error #418"));
              if(hydration.length) throw new Error(viewport.name+" emitted React #418: "+hydration.join(" | "));
              const other=pageErrors.filter(error=>!error.includes("Minified React error #418"));
              if(other.length) throw new Error(viewport.name+" page errors: "+other.join(" | "));

              const file="phase11-evidence/"+viewport.name+"-search.png";
              await page.screenshot({path:file,fullPage:true});
              evidence.surfaces.push({
                ...viewport,
                homeStatus:home?.status()??null,
                exploreStatus:explore?.status()??null,
                searchStatus:search?.status()??null,
                react418:0,
                tabs,
                hospazNonClickable:true,
                hospazDisclosure:adText,
                consoleErrors
              });
              await page.close();
            }
            await browser.close();
            fs.writeFileSync("phase11-evidence/manifest.json",JSON.stringify(evidence,null,2)+"\n");
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

      - name: Upload Phase 11 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag07-phase11-staging-runtime-candidate
          path: |
            apps/mobile/dist/build-info.json
            migration-output/ag05-phase3/staging-evidence.json
            migration-output/ag07-phase4/http-evidence.json
            phase11-evidence/
            /tmp/phase11-staging-runtime.log
          if-no-files-found: warn
          retention-days: 30
