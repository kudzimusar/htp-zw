name: AG-07 Phase 4 Unified Web/PWA

on:
  push:
    branches:
      - integration/ag07-phase4-unified-web-pwa
      - integration/ag07-phase8-convergence-candidate
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migration-lineage/**'
      - 'tests/migration/ag04-phase5-lineage.spec.js'
      - 'tests/migration/ag07-phase4-browser.spec.js'
      - 'tests/ag06-security-contract.spec.js'
      - 'tests/ca01-contract.spec.js'
      - 'tests/com01-contract.spec.js'
      - '.github/workflows/ag07-phase4-web-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ag07-phase4-unified-web-pwa
  cancel-in-progress: true

jobs:
  phase4-contract-browser:
    name: Universal Reader build + contract + browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: staging
      EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: source-parity
      HEALTHTIMES_WEB_BASE_URL: ""
      EXPO_PUBLIC_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
      HEALTHTIMES_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
      HEALTHTIMES_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          [[ "$actual" == "$EXPECTED_SHA" ]] || { echo "Exact-head checkout mismatch"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root test dependencies
        run: npm install --no-audit --no-fund
      - name: Install universal Reader dependencies
        run: npm install --prefix apps/mobile --no-audit --no-fund
      - name: Validate universal Reader
        run: npm run native:check
      - name: Preserve Phase 3 CP5 capability contract
        run: npm run test:ag05:capability
      - name: Preserve AG-06, CA-01 and COM-01 contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:ag06:contract
          npm run test:ca01:contract
          npm run test:com01:contract
      - name: Run Phase 4 serving contract
        run: npm run test:phase4:web
      - name: Build root-origin universal Reader
        run: npm run build:phase4:web
      - name: Prove live raw HTTP SEO and route decisions
        run: npm run verify:phase4:http
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke — mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          node scripts/web/phase4-smoke-server.js >/tmp/phase4-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            if [[ "$attempt" == "5" ]]; then cat /tmp/phase4-smoke.log; exit 1; fi
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4174 npm run test:phase4:browser
      - name: Upload browser and raw HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag07-phase4-browser-http-evidence
          path: |
            playwright-report
            test-results
            apps/mobile/dist/build-info.json
            migration-output/ag07-phase4/http-evidence.json
          if-no-files-found: warn
          retention-days: 14

  phase4-readonly-staging:
    name: CP5 read-only staging invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEALTHTIMES_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
      HEALTHTIMES_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          [[ "$actual" == "$EXPECTED_SHA" ]] || { echo "Exact-head checkout mismatch"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root test dependencies
        run: npm install --no-audit --no-fund
      - name: Refuse non-staging target and privileged key names
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEALTHTIMES_SUPABASE_URL" == *"gcdohgbmqhqwydgaxrcr"* ]]
          test -n "$HEALTHTIMES_SUPABASE_PUBLISHABLE_KEY"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${HEALTHTIMES_SUPABASE_SERVICE_ROLE_KEY:-}"
      - name: Re-prove Phase 3 public semantics read-only
        run: npm run verify:ag05:readonly
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag07-phase4-readonly-staging-evidence
          path: migration-output/ag05-phase3/staging-evidence.json
          if-no-files-found: error
          retention-days: 14
