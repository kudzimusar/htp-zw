name: Chromium UAT — Canonical Reader

on:
  push:
    branches:
      - main
      - integration/ag07-phase12-legacy-retirement-precp7
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthtimes-canonical-chromium-uat-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  APP_ENV: staging
  EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
  HEALTHTIMES_WEB_BASE_URL: ""
  EXPO_PUBLIC_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk
  HEALTHTIMES_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  HEALTHTIMES_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact repository head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Prove exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$CHECKED_OUT_SHA"
          test "$CHECKED_OUT_SHA" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root and canonical Reader dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix apps/mobile --no-audit --no-fund

      - name: Verify dual-serving retirement gate
        run: npm run test:phase12:dual-serving

      - name: Build exact canonical staging Reader
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build:phase4:web

      - name: Prove packaged runtime identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const info=JSON.parse(fs.readFileSync("apps/mobile/dist/build-info.json","utf8"));
          if(info.sha!==process.env.EXPECTED_SHA) throw new Error("build-info SHA mismatch: "+JSON.stringify(info));
          if(info.presentation!=="apps/mobile") throw new Error("presentation mismatch: "+JSON.stringify(info));
          if(info.serviceMode!=="staging") throw new Error("service mode mismatch: "+JSON.stringify(info));
          console.log(JSON.stringify(info,null,2));
          NODE

      - name: Prove CP5 raw HTTP and Premium fail-closed
        run: npm run verify:phase4:http

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical Phase 12 UAT against exact bundle + live read-only CP5
        shell: bash
        run: |
          set -euo pipefail
          node scripts/web/phase12-live-smoke-server.js >/tmp/phase12-canonical-uat.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4176/ >/dev/null; then break; fi
            if [[ "$attempt" == "20" ]]; then cat /tmp/phase12-canonical-uat.log; exit 1; fi
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4176 npm run test:uat

      - name: Upload canonical UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-canonical-reader-uat
          path: |
            playwright-report/
            test-results/
            apps/mobile/dist/build-info.json
            migration-output/ag07-phase4/http-evidence.json
            /tmp/phase12-canonical-uat.log
          if-no-files-found: warn
          retention-days: 30
