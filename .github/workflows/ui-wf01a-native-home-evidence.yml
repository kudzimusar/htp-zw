name: UI-WF-01A Native Home Evidence

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ui-wf01a-native-home-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: development
  EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: source-parity
  EXPO_PUBLIC_HEALTHTIMES_PREMIUM_PREVIEW_SECONDS: "0"
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUN_ATTEMPT: ${{ github.run_attempt }}
  FLOW: apps/mobile/e2e/ui-wf01a-home-native.yaml

jobs:
  ios-home:
    name: iOS ${{ matrix.device_class }} UI-WF Home
    if: github.event.pull_request.head.ref == 'feat/ui-wf01a-home-shared-shell-foundation'
    runs-on: macos-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_class: phone
            simulator_prefix: iPhone
          - device_class: tablet
            simulator_prefix: iPad
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Prove exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install canonical Reader
        run: npm install --prefix apps/mobile --no-audit --no-fund

      - name: Generate iOS native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Resolve Xcode workspace and scheme
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          WORKSPACE_NAME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -list -json -workspace "$WORKSPACE" > xcode-list.json
          SCHEME=$(WORKSPACE_NAME="$WORKSPACE_NAME" python3 - <<'PY'
          import json, os
          data=json.load(open('xcode-list.json'))
          schemes=data.get('workspace',{}).get('schemes',[])
          preferred=os.environ['WORKSPACE_NAME']
          if preferred in schemes:
              print(preferred)
          else:
              app=[s for s in schemes if not s.startswith(('EX','Pods-','React','ExpoModules','RN'))]
              if not app:
                  raise SystemExit('No application scheme found')
              print(app[0])
          PY
          )
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Resolve current supported simulator
        shell: bash
        env:
          SIMULATOR_PREFIX: ${{ matrix.simulator_prefix }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, re, subprocess
          prefix=os.environ["SIMULATOR_PREFIX"]
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates=[]
          for runtime,devices in data.get("devices",{}).items():
              version=tuple(int(x) for x in re.findall(r"\d+",runtime))
              for device in devices:
                  name=device.get("name","")
                  udid=device.get("udid","")
                  if name.startswith(prefix) and udid:
                      candidates.append((version,name,udid,runtime))
          if not candidates:
              raise SystemExit("No available simulator matching "+prefix)
          version,name,udid,runtime=sorted(candidates)[-1]
          print("SIM_UDID="+udid)
          print("SIM_NAME="+name)
          print("SIM_RUNTIME="+runtime.rsplit(".",1)[-1].replace("-",".").replace("iOS.","iOS "))
          PY

      - name: Reset and start simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true
          xcrun simctl erase "$SIM_UDID"
          xcrun simctl boot "$SIM_UDID"

      - name: Build Debug simulator app
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -derivedDataPath "$PWD/DerivedData" CODE_SIGNING_ALLOWED=NO build
          APP=$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 2 -type d -name '*.app' -print -quit)
          test -n "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE_ID" = "zw.co.healthtimes.app.dev"
          echo "IOS_APP=$PWD/$APP" >> "$GITHUB_ENV"

      - name: Install Maestro
        shell: bash
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Capture focused iOS Home evidence
        shell: bash
        env:
          DEVICE_CLASS: ${{ matrix.device_class }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          set -euo pipefail
          EVIDENCE_DIR="ui-wf01a-native-evidence/ios-$DEVICE_CLASS"
          mkdir -p "$EVIDENCE_DIR"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl ui "$SIM_UDID" appearance light || true

          (
            cd apps/mobile
            CI=1 EXPO_UNSTABLE_HEADLESS=1 EXPO_NO_DEV_MENU=1 npx expo start --localhost > "../../$EVIDENCE_DIR/metro.log" 2>&1
          ) &
          METRO_PID=$!
          trap 'kill "$METRO_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 120); do
            if ! kill -0 "$METRO_PID" 2>/dev/null; then
              cat "$EVIDENCE_DIR/metro.log"
              exit 1
            fi
            if curl --connect-timeout 1 --max-time 2 -sS -o /dev/null http://localhost:8081/; then
              break
            fi
            test "$i" != "120" || exit 1
            sleep 2
          done

          xcrun simctl install "$SIM_UDID" "$IOS_APP"
          maestro --device "$SIM_UDID" test --test-output-dir "$EVIDENCE_DIR" "$FLOW"

          : > "$EVIDENCE_DIR/native-errors.log"
          grep -E '^ ERROR  ' "$EVIDENCE_DIR/metro.log" >> "$EVIDENCE_DIR/native-errors.log" || true
          xcrun simctl spawn "$SIM_UDID" log show --last 30m --style compact \
            --predicate 'process CONTAINS[c] "HealthTimes"' 2>/dev/null \
            | grep -E '\[com\.facebook\.react\.log:javascript\].*(ERROR|Error|Fatal|Exception)|Unhandled JS Exception|RCTFatal|Terminating app' \
            >> "$EVIDENCE_DIR/native-errors.log" || true
          test ! -s "$EVIDENCE_DIR/native-errors.log"

          EVIDENCE_DIR="$EVIDENCE_DIR" DEVICE_CLASS="$DEVICE_CLASS" node - <<'NODE'
          const fs=require("fs"), path=require("path");
          const root=process.env.EVIDENCE_DIR;
          const screenshots=[];
          const walk=(dir)=>{for(const e of fs.readdirSync(dir,{withFileTypes:true})){const f=path.join(dir,e.name);if(e.isDirectory())walk(f);else if(/\.png$/i.test(e.name))screenshots.push(path.relative(root,f));}};
          walk(root);
          fs.writeFileSync(path.join(root,"identity.json"),JSON.stringify({
            task:"UI-WF-01A",candidateSha:process.env.EXPECTED_SHA,runAttempt:process.env.RUN_ATTEMPT,
            platform:"iOS",deviceClass:process.env.DEVICE_CLASS,deviceIdentity:process.env.SIM_NAME,
            osVersion:process.env.SIM_RUNTIME,orientation:"portrait",screenshots:screenshots.sort()
          },null,2));
          NODE

      - name: Upload focused iOS Home evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-wf01a-native-ios-${{ matrix.device_class }}-attempt-${{ github.run_attempt }}
          path: ui-wf01a-native-evidence/
          if-no-files-found: error
          retention-days: 30

  android-home:
    name: Android ${{ matrix.device_class }} UI-WF Home
    if: github.event.pull_request.head.ref == 'feat/ui-wf01a-home-shared-shell-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_class: phone
            profile: pixel_7_pro
          - device_class: tablet
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Prove exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install canonical Reader
        run: npm install --prefix apps/mobile --no-audit --no-fund

      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build self-contained Android release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Install Maestro
        shell: bash
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run focused Android Home evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          enable-hw-keyboard: false
          disk-size: 6000M
          heap-size: 1024M
          script: RUN_ATTEMPT="$RUN_ATTEMPT" bash scripts/native/ui-wf01a-android-run.sh "${{ matrix.device_class }}" "${{ matrix.profile }}" "$FLOW" "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Upload focused Android Home evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-wf01a-native-android-${{ matrix.device_class }}-attempt-${{ github.run_attempt }}
          path: ui-wf01a-native-evidence/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate exact-head UI-WF native Home matrix
    if: always() && github.event.pull_request.head.ref == 'feat/ui-wf01a-home-shared-shell-foundation'
    needs: [ios-home, android-home]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Prove exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download focused native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ui-wf01a-native-*-attempt-${{ github.run_attempt }}
          path: downloaded
          merge-multiple: false

      - name: Enforce complete exact-head matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, os
          root=pathlib.Path("downloaded")
          expected={
            ("iOS","phone"),("iOS","tablet"),
            ("Android","phone"),("Android","tablet")
          }
          seen=set()
          manifests=[]
          for p in root.rglob("identity.json"):
              data=json.loads(p.read_text())
              assert data["candidateSha"]==os.environ["EXPECTED_SHA"], (p,data.get("candidateSha"))
              cell=(data["platform"],data["deviceClass"])
              seen.add(cell)
              shots=data.get("screenshots",[])
              assert any("home-light" in x for x in shots), (cell,shots)
              assert any("home-top-stories" in x for x in shots), (cell,shots)
              assert any("appearance-dark-selected" in x for x in shots), (cell,shots)
              assert any("home-dark" in x for x in shots), (cell,shots)
              manifests.append(data)
          assert seen==expected, (seen,expected)
          pathlib.Path("ui-wf01a-native-aggregate").mkdir(exist_ok=True)
          pathlib.Path("ui-wf01a-native-aggregate/manifest.json").write_text(json.dumps({
            "task":"UI-WF-01A",
            "candidateSha":os.environ["EXPECTED_SHA"],
            "cells":sorted(manifests,key=lambda x:(x["platform"],x["deviceClass"]))
          },indent=2))
          PY

      - name: Upload aggregate UI-WF native matrix
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ui-wf01a-native-home-matrix-attempt-${{ github.run_attempt }}
          path: |
            downloaded/
            ui-wf01a-native-aggregate/
          if-no-files-found: error
          retention-days: 30

      - name: Record aggregate identity
        run: |
          {
            echo "## UI-WF-01A Native Home Matrix"
            echo "- Candidate SHA: $EXPECTED_SHA"
            echo "- Artifact ID: ${{ steps.upload.outputs.artifact-id }}"
            echo "- Artifact digest: ${{ steps.upload.outputs.artifact-digest }}"
            echo "- Artifact URL: ${{ steps.upload.outputs.artifact-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
