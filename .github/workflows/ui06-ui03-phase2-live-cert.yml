name: UI-06 UI-03 Phase 2 Live Certification

on:
  push:
    branches:
      - test/ui06-ui03-phase2-live-cert
    paths:
      - '.github/workflows/ui06-ui03-phase2-live-cert.yml'
      - 'scripts/ui/ui06-ui03-phase2-live-cert.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui06-ui03-phase2-live-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-live-commercial-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_URL: https://kudzimusar.github.io/htp-zw/
      TARGET_DEPLOYED_SHA: 8611beb08a9cc43accc9109457ed48901c3daaf1
      ACCEPTED_EXECUTABLE_SHA: 6cbfcaa9ee6c06e25f59c99eb21bf86211990605
      ARTIFACT_DIR: artifacts/ui06/ui03-phase2-live-cert
    steps:
      - name: Check out certification tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prove exact certification tooling SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CERTIFICATION_TOOLING_SHA=$actual"
          echo "DEPLOYED_WRAPPER_SHA=$TARGET_DEPLOYED_SHA"
          echo "ACCEPTED_EXECUTABLE_SHA=$ACCEPTED_EXECUTABLE_SHA"
          test "$actual" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install existing certification dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run live UI-06 Phase 2 certification
        env:
          CERTIFICATION_TOOLING_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node --input-type=module -e 'globalThis.viewports={mobile:{width:390,height:844},tablet:{width:834,height:1112},desktop:{width:1440,height:1000}}; await import("./scripts/ui/ui06-ui03-phase2-live-cert.mjs")'

      - name: Upload UI-06 Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui06-ui03-phase2-live-cert
          path: artifacts/ui06/ui03-phase2-live-cert/
          if-no-files-found: warn
          retention-days: 30
