name: UI-06 UI-03 Phase 2 Live Certification

on:
  pull_request:
    branches:
      - deployment/ui03-phase2-commercial-reader-candidate
    paths:
      - '.github/workflows/ui06-ui03-phase2-live-cert.yml'
      - 'scripts/ui/ui06-ui03-phase2-live-cert.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui06-ui03-phase2-live-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-live-commercial-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_URL: https://kudzimusar.github.io/htp-zw/
      TARGET_DEPLOYED_SHA: 8611beb08a9cc43accc9109457ed48901c3daaf1
      ACCEPTED_EXECUTABLE_SHA: 6cbfcaa9ee6c06e25f59c99eb21bf86211990605
      ARTIFACT_DIR: artifacts/ui06/ui03-phase2-live-cert

    steps:
      - name: Check out certification tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Prove exact certification tooling SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CERTIFICATION_TOOLING_SHA=$actual"
          echo "DEPLOYED_WRAPPER_SHA=$TARGET_DEPLOYED_SHA"
          echo "ACCEPTED_EXECUTABLE_SHA=$ACCEPTED_EXECUTABLE_SHA"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_TOOLING_SHA=$expected"
          test "$actual" = "$expected"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install existing certification dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live UI-06 Phase 2 certification
        env:
          CERTIFICATION_TOOLING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_NAME: ${{ runner.name }}
        run: node scripts/ui/ui06-ui03-phase2-live-cert.mjs

      - name: Re-capture focused Premium paywall evidence
        if: success()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          import fs from "node:fs";
          const base="https://kudzimusar.github.io/htp-zw";
          const root="artifacts/ui06/ui03-phase2-live-cert";
          const article="/article/source-us-embassy-challenges-zimbabwe-rejected-health-mou";
          const browser=await chromium.launch({headless:true});
          async function capture(name,viewport,dark=false){
            const context=await browser.newContext({viewport,deviceScaleFactor:1});
            const page=await context.newPage();
            if(dark){
              await page.goto(base+"/appearance",{waitUntil:"domcontentloaded",timeout:30000});
              const button=page.getByRole("button",{name:"Dark",exact:true});
              await button.waitFor({state:"visible",timeout:30000});
              await button.click();
              await page.waitForTimeout(500);
            }
            await page.goto(base+article,{waitUntil:"domcontentloaded",timeout:30000});
            const heading=page.getByText("Continue reading with HealthTimes Premium",{exact:false}).first();
            await heading.waitFor({state:"visible",timeout:30000});
            const member=page.getByRole("button",{name:/Sign in as an existing member|Member sign in|Sign in/i}).first();
            await member.waitFor({state:"visible",timeout:30000});
            await member.scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);
            const file=dark?root+"/dark/premium-paywall-mobile.png":root+"/premium-article/"+name+"-paywall.png";
            await page.screenshot({path:file,fullPage:false});
            await context.close();
          }
          try {
            await capture("mobile",{width:390,height:844},false);
            await capture("desktop",{width:1440,height:1000},false);
            await capture("mobile",{width:390,height:844},true);
          } finally {
            await browser.close();
          }
          fs.writeFileSync(root+"/paywall-visual-recapture.json",JSON.stringify({
            mobile_light:"premium-article/mobile-paywall.png",
            desktop_light:"premium-article/desktop-paywall.png",
            mobile_dark:"dark/premium-paywall-mobile.png",
            paywall_cta_scrolled_into_view:true
          },null,2)+"\n");
          NODE

      - name: Re-capture resolved public advertising state
        if: success()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          import fs from "node:fs";
          const base="https://kudzimusar.github.io/htp-zw";
          const root="artifacts/ui06/ui03-phase2-live-cert";
          const views={mobile:{width:390,height:844},tablet:{width:834,height:1112},desktop:{width:1440,height:1000}};
          const browser=await chromium.launch({headless:true});
          const receipt=[];
          try {
            for (const [name,viewport] of Object.entries(views)) {
              const context=await browser.newContext({viewport,deviceScaleFactor:1});
              const page=await context.newPage();
              const response=await page.goto(base+"/",{waitUntil:"domcontentloaded",timeout:30000});
              await page.getByText("Top Stories",{exact:true}).waitFor({state:"visible",timeout:30000});
              await page.waitForFunction(()=>!document.body.innerText.includes("Loading Home…"),null,{timeout:30000});
              const hospaz=await page.getByText("Direct advertising · HOSPAZ",{exact:true}).first().isVisible().catch(()=>false);
              const file=root+"/advertising/"+name+"-source-parity.png";
              await page.screenshot({path:file,fullPage:true});
              receipt.push({viewport:name,status:response?.status()||null,home_resolved:true,HOSPAZ_present:hospaz,screenshot:"advertising/"+name+"-source-parity.png"});
              await context.close();
            }
          } finally {
            await browser.close();
          }
          fs.writeFileSync(root+"/advertising-resolution.json",JSON.stringify(receipt,null,2)+"\n");
          NODE

      - name: Capture first-blocker Article evidence
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          import fs from "node:fs";
          const root="artifacts/ui06/ui03-phase2-live-cert";
          fs.mkdirSync(root+"/article",{recursive:true});
          const url="https://kudzimusar.github.io/htp-zw/article/source-zimbabwe-strengthens-social-contracting-as-hiv-donor-funding-shrinks";
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
          const page=await context.newPage();
          const imageResponses=[];
          page.on("response",r=>{
            if(r.request().resourceType()==="image") imageResponses.push({url:r.url(),status:r.status()});
          });
          const response=await page.goto(url,{waitUntil:"domcontentloaded",timeout:30000});
          await page.waitForFunction(()=>!document.body.innerText.includes("Loading article…"),null,{timeout:30000}).catch(()=>{});
          await page.waitForTimeout(1200);
          const hero=page.locator('[data-testid="article-hero-media"]:visible img').first();
          const heroPresent=await hero.count()>0;
          const metrics=heroPresent?await hero.evaluate(img=>{
            const r=img.getBoundingClientRect();
            return {
              src:img.currentSrc||img.src||null,
              complete:img.complete,
              naturalWidth:img.naturalWidth,
              naturalHeight:img.naturalHeight,
              renderedWidth:Math.round(r.width),
              renderedHeight:Math.round(r.height)
            };
          }).catch(()=>null):null;
          const screenshot="article/mobile-public-failure.png";
          await page.screenshot({path:root+"/"+screenshot,fullPage:true});
          const heroResponse=metrics?.src?imageResponses.find(x=>x.url===metrics.src)||null:null;
          fs.writeFileSync(root+"/blocker-evidence.json",JSON.stringify({
            route:url,
            viewport:{width:390,height:844},
            document_status:response?.status()||null,
            screenshot,
            hero:metrics,
            hero_response:heroResponse,
            image_responses:imageResponses
          },null,2)+"\n");
          await context.close();
          await browser.close();
          NODE

      - name: Generate bounded certification report
        if: always()
        shell: bash
        env:
          CERTIFICATION_TOOLING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node <<'NODE'
          const fs=require("fs");
          const path=require("path");
          const root="artifacts/ui06/ui03-phase2-live-cert";
          const manifestPath=path.join(root,"manifest.json");
          const summaryPath=path.join(root,"summary.md");
          const reportPath="docs/native-mobile/UI-06_UI03_PHASE2_LIVE_CERTIFICATION.md";
          const manifest=fs.existsSync(manifestPath)?JSON.parse(fs.readFileSync(manifestPath,"utf8")):null;
          const summary=fs.existsSync(summaryPath)?fs.readFileSync(summaryPath,"utf8"):"";
          const items=manifest?.primary_results||[];
          const article=items.filter(x=>x.surface==="public_article");
          const premium=items.filter(x=>x.surface==="premium_article"&&x.appearance!=="dark");
          const landing=items.filter(x=>x.surface==="premium_landing"&&x.appearance!=="dark");
          const dark=items.filter(x=>x.appearance==="dark"||String(x.surface).startsWith("dark_"));
          const md=[];
          const p=x=>md.push(x);
          p("# UI-06 UI-03 Phase 2 Live Commercial Reader Certification");
          p("");
          p("## Exact identities");
          p("");
          p("- Repository: `kudzimusar/htp-zw`");
          p("- Certification branch: `test/ui06-ui03-phase2-live-cert`");
          p("- Certification starting wrapper: `8611beb08a9cc43accc9109457ed48901c3daaf1`");
          p("- Certification tooling SHA: `"+process.env.CERTIFICATION_TOOLING_SHA+"`");
          p("- Documentation closure SHA: `db9eebb7fef6b8ee9f3d784d14f1f5394a234499`");
          p("- Live deployment wrapper: `"+(manifest?.deployed_wrapper_sha||"NOT CAPTURED")+"`");
          p("- Underlying accepted UI-03 executable: `"+(manifest?.accepted_executable_sha||"6cbfcaa9ee6c06e25f59c99eb21bf86211990605")+"`");
          p("- Workflow run: `"+process.env.GITHUB_RUN_ID+"`");
          p("- Evidence artifact: `ui06-ui03-phase2-live-cert`");
          p("");
          p("## Deployment identity");
          p("");
          if(manifest){p("- build-info SHA: `"+manifest.build_info_sha+"`");p("- public URL: `"+manifest.public_url+"`");}
          else p("- Structured live manifest was not produced.");
          p("");
          p("## Browser environment");
          p("");
          if(manifest){p("- Browser: "+manifest.browser+" "+manifest.browser_version);p("- Playwright: "+manifest.playwright_version);p("- Node: "+manifest.node_version);p("- Runner: "+manifest.runner);p("- OS: "+manifest.os);p("- Device scale factor: "+manifest.device_scale_factor);}
          p("");
          p("## Article");
          p("");
          if(article.length){
            p("| Viewport | Hero | Intrinsic | Rendered | #418 | Page errors | Overflow | Screenshot |");
            p("|---|---|---|---|---:|---:|---|---|");
            for(const x of article){
              const h=x.hero||x;
              p("| "+x.viewport+" | "+(h.complete??x.hero_media_complete?"PASS":"FAIL")+" | "+(h.natural_width??x.hero_natural_width)+"×"+(h.natural_height??x.hero_natural_height)+" | "+(h.rendered_width??x.hero_rendered_width)+"×"+(h.rendered_height??x.hero_rendered_height)+" | "+(x.React_418_count||0)+" | "+(x.pageerror_count||0)+" | "+(x.horizontal_overflow?"FAIL":"PASS")+" | `"+x.screenshot+"` |");
            }
          } else p("- No complete public Article viewport evidence recorded.");
          p("");
          p("## Premium security and live commercial behavior");
          p("");
          if(premium.length){
            for(const x of premium){
              p("### "+x.viewport);p("");
              p("- anonymous: `"+x.anonymous+"`");
              p("- entitlement_state: `"+x.entitlement_state+"`");
              p("- paywall_visible: `"+x.paywall_visible+"`");
              p("- protected_body_present_in_dom: `"+x.protected_body_present_in_dom+"`");
              p("- protected_body_network_retrieval: `"+x.protected_body_network_retrieval+"`");
              p("- preview_timer_active: `"+x.preview_timer_active+"`");
              p("- preview_duration_observed: `"+x.preview_duration_observed+"`");
              p("- preview_configuration_state: `"+x.preview_configuration_state+"`");p("");
            }
          } else p("- No complete Premium Article evidence recorded.");
          p("- commercial_preview_duration_configured: `"+(manifest?.commercial_preview_duration_configured??"NOT CAPTURED")+"`");
          p("- commercial_preview_policy_status: `"+(manifest?.commercial_preview_policy_status??"NOT CAPTURED")+"`");
          p("");
          p("## Premium landing");
          p("");
          if(landing.length) for(const x of landing) p("- "+x.viewport+": stories="+x.premium_story_count+", store_state=`"+x.store_reader_state+"`, price_visible=`"+x.price_visible+"`, restore=`"+x.restore_visible+"`, member_sign_in=`"+x.member_sign_in_visible+"`, screenshot=`"+x.screenshot+"`");
          else p("- No complete Premium landing evidence recorded.");
          p("");
          p("## Dark appearance");
          p("");
          if(dark.length) for(const x of dark) p("- "+x.surface+": viewport="+x.viewport+", #418="+(x.React_418_count||0)+", page_errors="+(x.pageerror_count||0)+", overflow="+Boolean(x.horizontal_overflow)+", screenshot=`"+(x.screenshot||"see paywall evidence")+"`");
          else p("- No complete dark evidence recorded.");
          p("");
          p("## Advertising / HOSPAZ");
          p("");
          if(manifest?.advertising) for(const x of manifest.advertising) p("- "+x.viewport+": advertising_source=`"+x.advertising_source+"`, HOSPAZ_present=`"+x.HOSPAZ_present+"`, ad_gap_present=`"+x.ad_gap_present+"`, screenshot=`"+x.screenshot+"`");
          else p("- Advertising evidence was not completed.");
          p("");
          p("## Runtime");
          p("");
          if(manifest){p("- React #418 count: `"+manifest.React_418_count+"`");p("- Page error count: `"+manifest.pageerror_count+"`");p("- Console error count: `"+manifest.console_error_count+"`");p("- HTTP resource error count: `"+manifest.resource_http_error_count+"`");p("- Service worker registered: `"+manifest.service_worker_registered+"`");p("- Service worker controlling: `"+manifest.service_worker_controlling+"`");}
          p("");
          p("## Findings");
          p("");
          if(manifest?.findings?.length) for(const x of manifest.findings) p("- **"+x.severity+" / "+x.category+"** — "+x.message);
          else p("- No separate findings recorded.");
          if(manifest?.first_blocker) p("- **FIRST BLOCKER:** "+manifest.first_blocker.severity+" — "+manifest.first_blocker.message);
          p("");
          p("## Authority preservation");
          p("");
          for(const x of ["apps/mobile changed: NO","Pages workflow changed: NO","deployment changed: NO","DESIGN.md changed: NO","Premium service changed: NO","Premium preview configuration changed: NO","store products/pricing changed: NO","HOSPAZ authority changed: NO","advertising provider activated: NO","staging changed: NO","COM changed: NO","Studio changed: NO","main changed: NO","PR #42 merged: NO","PR #43 merged: NO","production changed: NO"]) p("- "+x);
          p("");
          p("## Final disposition");
          p("");
          const final=(summary.match(/UI-06 PHASE 2 LIVE COMMERCIAL READER[^\n]+/g)||[]).at(-1)
            ||(manifest?.first_blocker?"UI-06 PHASE 2 LIVE COMMERCIAL READER NOT CERTIFIED — "+manifest.first_blocker.message:"UI-06 PHASE 2 LIVE COMMERCIAL READER NOT CERTIFIED — certification summary unavailable");
          p(final);p("");
          fs.mkdirSync(path.dirname(reportPath),{recursive:true});
          fs.writeFileSync(reportPath,md.join("\n"));
          if(fs.existsSync(root))fs.copyFileSync(reportPath,path.join(root,"UI-06_UI03_PHASE2_LIVE_CERTIFICATION.md"));
          NODE

      - name: Upload UI-06 Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui06-ui03-phase2-live-cert
          path: artifacts/ui06/ui03-phase2-live-cert/
          if-no-files-found: warn
          retention-days: 30

