name: UI-WF-01B-R2 Owner Checkpoint Home Evidence
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ui-wf01b-r2-home-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  UI_WF01B_MAIN_SHA: 6994aa18d37e2189dbc1d3f8efc76a638ee0971c
jobs:
  owner-checkpoint-home:
    if: github.event.pull_request.head.ref == 'feat/ui-wf01a-compact-reader-shell'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          test "$(git merge-base "$EXPECTED_SHA" "$UI_WF01B_MAIN_SHA")" = "$UI_WF01B_MAIN_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded certification dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix apps/mobile --no-audit --no-fund
      - name: Run owner Home contracts and protected Reader regressions
        run: |
          npm --prefix apps/mobile run test:ui-wf01b-r2
          npm --prefix apps/mobile run test:reader-product
          npm --prefix apps/mobile run test:ui03
          npm --prefix apps/mobile run test:ui05
          npm --prefix apps/mobile run test:premium-hospaz
          npm --prefix apps/mobile run test:identity-security
          npm --prefix apps/mobile run typecheck
      - name: Install Chromium evidence runtime
        run: npx playwright install --with-deps chromium
      - name: Build exact PR84 source-parity PWA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/mobile/dist ui-wf01b-sites ui-wf01b-evidence
          APP_ENV=development EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE=source-parity HEALTHTIMES_WEB_BASE_URL=/htp-zw npm --prefix apps/mobile run export:web
          mkdir -p ui-wf01b-sites/candidate/htp-zw
          cp -R apps/mobile/dist/. ui-wf01b-sites/candidate/htp-zw/
      - name: Build immutable canonical-main comparator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/htp-zw-ui-wf01b-main
          git worktree add --detach /tmp/htp-zw-ui-wf01b-main "$UI_WF01B_MAIN_SHA"
          npm install --prefix /tmp/htp-zw-ui-wf01b-main/apps/mobile --no-audit --no-fund
          (cd /tmp/htp-zw-ui-wf01b-main && APP_ENV=development EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE=source-parity HEALTHTIMES_WEB_BASE_URL=/htp-zw npm --prefix apps/mobile run export:web)
          mkdir -p ui-wf01b-sites/current-main/htp-zw
          cp -R /tmp/htp-zw-ui-wf01b-main/apps/mobile/dist/. ui-wf01b-sites/current-main/htp-zw/
      - name: Assemble approved reference authority
        run: |
          mkdir -p ui-wf01b-evidence/reference ui-wf01b-evidence/web
          cp docs/native-mobile/assets/HEALTHTIMES_NATIVE_WIREFRAME_V1.png ui-wf01b-evidence/reference/HEALTHTIMES_NATIVE_WIREFRAME_V1.png
          cp docs/native-mobile/DESIGN.md ui-wf01b-evidence/reference/DESIGN.md
      - name: Serve immutable evidence builds
        shell: bash
        run: |
          python3 -m http.server 4173 --directory ui-wf01b-sites/candidate >/tmp/uiwf-candidate.log 2>&1 &
          python3 -m http.server 4174 --directory ui-wf01b-sites/current-main >/tmp/uiwf-main.log 2>&1 &
          for url in http://127.0.0.1:4173/htp-zw/ http://127.0.0.1:4174/htp-zw/; do
            for attempt in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then break; fi
              test "$attempt" != 30
              sleep 1
            done
          done
      - name: Capture Owner Checkpoint evidence
        env:
          UI_WF01B_CANDIDATE_BASE: http://127.0.0.1:4173/htp-zw
          UI_WF01B_CURRENT_BASE: http://127.0.0.1:4174/htp-zw
          UI_WF01B_EVIDENCE_DIR: ui-wf01b-evidence/web
        run: npx playwright test tests/ui-wf01b-r2-home-evidence.spec.js
      - name: Write exact-head manifest
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs"),crypto=require("crypto"),path=require("path");
          const root="ui-wf01b-evidence",files=[];
          const walk=(d)=>{if(!fs.existsSync(d))return;for(const e of fs.readdirSync(d,{withFileTypes:true})){const f=path.join(d,e.name);if(e.isDirectory())walk(f);else files.push({file:path.relative(root,f),sha256:crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex")});}};
          walk(root);
          fs.writeFileSync(path.join(root,"manifest.json"),JSON.stringify({task:"UI-WF-01B-R2",candidateSha:process.env.EXPECTED_SHA,currentMainSha:process.env.UI_WF01B_MAIN_SHA,comparison:["REFERENCE WIREFRAME","CURRENT MAIN","FINAL PR #84 CANDIDATE"],webViewports:["390x844","834x1112","1440x1000"],stateEvidence:["phone-dark","no-Live","unfilled-ad"],deploymentPerformed:false,files:files.sort((a,b)=>a.file.localeCompare(b.file))},null,2));
          NODE
          sha256sum ui-wf01b-evidence/manifest.json > ui-wf01b-evidence/manifest.sha256
      - name: Upload Owner Checkpoint Home evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-wf01b-r2-owner-home-evidence-attempt-${{ github.run_attempt }}
          path: |
            ui-wf01b-evidence/
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 30
      - name: Record artifact identity
        if: always()
        run: |
          echo "Candidate SHA: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact ID: ${{ steps.upload.outputs.artifact-id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact URL: ${{ steps.upload.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
