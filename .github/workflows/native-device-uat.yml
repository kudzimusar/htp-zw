name: NM-07 Native Device-Class UAT

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/native-device-uat.yml'
      - '.github/workflows/native-certification.yml'
      - '.github/workflows/native-mobile.yml'
      - 'docs/native-mobile/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nm07-device-uat-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: staging
  EXPO_PUBLIC_HEALTHTIMES_SERVICE_MODE: staging
  EXPO_PUBLIC_SUPABASE_URL: https://gcdohgbmqhqwydgaxrcr.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fad1xU5q53KB2uq-D1shIw_6JH0vInk

jobs:
  ios-simulator-uat:
    name: iOS Simulator UAT (${{ matrix.family }})
    runs-on: macos-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mobile workspace
        run: npm install --prefix apps/mobile --no-audit --no-fund

      - name: Generate staging iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Select and boot simulator
        shell: bash
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          FAMILY="${{ matrix.family }}" python3 - <<'PY' > "$RUNNER_TEMP/selected-device.txt"
          import json, os
          data=json.load(open(os.environ["RUNNER_TEMP"]+"/devices.json"))
          family=os.environ["FAMILY"]
          matches=[]
          for runtime,devices in data.get("devices",{}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  name=device.get("name","")
                  if family=="iphone" and name.startswith("iPhone"):
                      matches.append((runtime,name,device["udid"]))
                  if family=="ipad" and name.startswith("iPad"):
                      matches.append((runtime,name,device["udid"]))
          if not matches:
              raise SystemExit("No available "+family+" simulator")
          runtime,name,udid=matches[-1]
          print(udid)
          print(name)
          print(runtime)
          PY
          SIM_UDID=$(sed -n '1p' "$RUNNER_TEMP/selected-device.txt")
          SIM_NAME=$(sed -n '2p' "$RUNNER_TEMP/selected-device.txt")
          SIM_RUNTIME=$(sed -n '3p' "$RUNNER_TEMP/selected-device.txt")
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"
          echo "SIM_RUNTIME=$SIM_RUNTIME" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          printf 'family=%s\nname=%s\nruntime=%s\nudid=%s\n' "${{ matrix.family }}" "$SIM_NAME" "$SIM_RUNTIME" "$SIM_UDID" > "$RUNNER_TEMP/ios-device.txt"

      - name: Resolve Xcode workspace and scheme
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          WORKSPACE_NAME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -list -json -workspace "$WORKSPACE" > xcode-list.json
          SCHEME=$(WORKSPACE_NAME="$WORKSPACE_NAME" python3 - <<'PY'
          import json, os
          data=json.load(open('xcode-list.json'))
          schemes=data.get('workspace',{}).get('schemes',[])
          preferred=os.environ['WORKSPACE_NAME']
          if preferred in schemes:
              print(preferred)
          else:
              candidates=[s for s in schemes if not s.startswith(('EX','Pods-','React','ExpoModules','RN'))]
              if not candidates:
                  raise SystemExit('No application scheme found')
              print(candidates[0])
          PY
          )
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Build self-contained staging simulator app
        working-directory: apps/mobile/ios
        run: |
          xcodebuild             -workspace "$WORKSPACE"             -scheme "$SCHEME"             -configuration Release             -sdk iphonesimulator             -destination "id=$SIM_UDID"             -derivedDataPath "$PWD/DerivedData"             CODE_SIGNING_ALLOWED=NO             build
          APP=$(find DerivedData/Build/Products/Release-iphonesimulator -maxdepth 2 -type d -name '*.app' -print -quit)
          test -n "$APP"
          echo "IOS_APP=$APP" >> "$GITHUB_ENV"

      - name: Install, launch, relaunch and deep-link
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          BUNDLE_ID=zw.co.healthtimes.app.staging
          xcrun simctl install "$SIM_UDID" "$IOS_APP"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" | tee "$RUNNER_TEMP/ios-first-launch.txt"
          sleep 8
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" | tee "$RUNNER_TEMP/ios-cold-launch.txt"
          sleep 5
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" | tee "$RUNNER_TEMP/ios-warm-launch.txt"
          sleep 5

          xcrun simctl io "$SIM_UDID" screenshot "$RUNNER_TEMP/ios-${{ matrix.family }}-warm.png"
          xcrun simctl spawn "$SIM_UDID" log show --style compact --last 3m --predicate 'process contains "HealthTimes"' > "$RUNNER_TEMP/ios-${{ matrix.family }}.log" || true
          if grep -Eq 'ERR_KEY_CHAIN|ERR_NOTIFICATIONS_KEYCHAIN_ACCESS|errSecMissingEntitlement|A required entitlement' "$RUNNER_TEMP/ios-${{ matrix.family }}.log"; then
            echo "PENDING_SIMULATOR_KEYCHAIN_ENTITLEMENT" > "$RUNNER_TEMP/ios-${{ matrix.family }}-auth-status.txt"
            grep -E 'ERR_KEY_CHAIN|ERR_NOTIFICATIONS_KEYCHAIN_ACCESS|errSecMissingEntitlement|A required entitlement' "$RUNNER_TEMP/ios-${{ matrix.family }}.log" > "$RUNNER_TEMP/ios-${{ matrix.family }}-keychain-errors.txt" || true
          else
            echo "SIMULATOR_KEYCHAIN_BASELINE_PASS" > "$RUNNER_TEMP/ios-${{ matrix.family }}-auth-status.txt"
          fi

          xcrun simctl openurl "$SIM_UDID" "healthtimes://article/parirenyatwa-hospital-commissions-new-heart-bypass-machine-boosts-open-heart-surgery-in-zimbabwe"
          sleep 5
          xcrun simctl io "$SIM_UDID" screenshot "$RUNNER_TEMP/ios-${{ matrix.family }}-deeplink.png"

      - name: Upload iOS UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nm07-ios-${{ matrix.family }}-uat
          path: |
            ${{ runner.temp }}/ios-device.txt
            ${{ runner.temp }}/ios-first-launch.txt
            ${{ runner.temp }}/ios-cold-launch.txt
            ${{ runner.temp }}/ios-warm-launch.txt
            ${{ runner.temp }}/ios-${{ matrix.family }}-warm.png
            ${{ runner.temp }}/ios-${{ matrix.family }}-deeplink.png
            ${{ runner.temp }}/ios-${{ matrix.family }}.log
            ${{ runner.temp }}/ios-${{ matrix.family }}-auth-status.txt
            ${{ runner.temp }}/ios-${{ matrix.family }}-keychain-errors.txt
          retention-days: 14

  android-emulator-uat:
    name: Android Emulator UAT (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        family: [phone, tablet]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile workspace
        run: npm install --prefix apps/mobile --no-audit --no-fund

      - name: Generate staging Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android staging debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Start Expo packager
        working-directory: apps/mobile
        shell: bash
        run: |
          CI=1 npx expo start --port 8081 > "$RUNNER_TEMP/expo-packager.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/expo-packager.pid"
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/expo-packager.log"
          exit 1

      - name: Prepare Android UAT script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/nm07-android-uat.sh" <<'BASH'
          #!/usr/bin/env bash
          set -eu

          adb reverse tcp:8081 tcp:8081

          # Some large tablet AVDs report sys.boot_completed before the
          # Android window/package services are actually ready for commands.
          for i in {1..60}; do
            if adb shell service check window 2>/dev/null | grep -q 'found' \
              && adb shell cmd package list packages >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          adb shell service check window | grep -q 'found'
          adb shell cmd package list packages >/dev/null

          if [ "${{ matrix.family }}" = "tablet" ]; then
            adb shell wm size 2560x1600
            adb shell wm density 320
          else
            adb shell wm size 1080x2400
            adb shell wm density 420
          fi

          printf 'family=%s\nmodel=%s\nos=%s\nsize=%s\ndensity=%s\n' \
            "${{ matrix.family }}" \
            "$(adb shell getprop ro.product.model | tr -d '\r')" \
            "$(adb shell getprop ro.build.version.release | tr -d '\r')" \
            "$(adb shell wm size | tr -d '\r')" \
            "$(adb shell wm density | tr -d '\r')" > "$RUNNER_TEMP/android-device.txt"

          APK=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          adb install -r "$APK"
          PACKAGE=zw.co.healthtimes.app.staging
          ACTIVITY="$PACKAGE/.MainActivity"

          adb shell am force-stop "$PACKAGE"
          adb shell am start -W -n "$ACTIVITY" | tee "$RUNNER_TEMP/android-first-launch.txt"
          sleep 10
          test -n "$(adb shell pidof "$PACKAGE" | tr -d '\r')"

          adb shell am force-stop "$PACKAGE"
          adb shell am start -W -n "$ACTIVITY" | tee "$RUNNER_TEMP/android-cold-launch.txt"
          sleep 5
          adb shell am start -W -n "$ACTIVITY" | tee "$RUNNER_TEMP/android-warm-launch.txt"

          adb shell am start -W -a android.intent.action.VIEW \
            -d "healthtimes://article/parirenyatwa-hospital-commissions-new-heart-bypass-machine-boosts-open-heart-surgery-in-zimbabwe" \
            "$PACKAGE" | tee "$RUNNER_TEMP/android-deeplink.txt"
          sleep 5

          adb exec-out screencap -p > "$RUNNER_TEMP/android-${{ matrix.family }}.png"
          adb logcat -d > "$RUNNER_TEMP/android-${{ matrix.family }}.log"
          BASH
          chmod +x "$RUNNER_TEMP/nm07-android-uat.sh"

      - name: Run Android emulator UAT
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.family == 'tablet' && 'Nexus 10' || 'pixel_7' }}
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: bash "$RUNNER_TEMP/nm07-android-uat.sh"

      - name: Upload Android UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nm07-android-${{ matrix.family }}-uat
          path: |
            ${{ runner.temp }}/android-device.txt
            ${{ runner.temp }}/android-first-launch.txt
            ${{ runner.temp }}/android-cold-launch.txt
            ${{ runner.temp }}/android-warm-launch.txt
            ${{ runner.temp }}/android-deeplink.txt
            ${{ runner.temp }}/android-${{ matrix.family }}.png
            ${{ runner.temp }}/android-${{ matrix.family }}.log
            ${{ runner.temp }}/expo-packager.log
          retention-days: 14